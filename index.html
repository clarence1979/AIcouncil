<!DOCTYPE html>
<!--
  AI COUNCIL — The Chamber
  Single-file, offline-first. No build step, no server, no dependencies.
  Converted from the React/Vite/Supabase "AI Council" app.

  The chamber backdrop, the crest and every icon are inline SVG, so the
  whole thing still travels as one file with nothing to fetch.

  Engines : Ollama (default) · WebLLM in-browser · OpenAI · Anthropic · Google
  Storage : localStorage only — members, standing orders, keys, model lists, session
  Network : nothing is contacted unless you pick a hosted engine or WebLLM

  Ollama needs CORS permission:  OLLAMA_ORIGINS=* ollama serve
  For a Pi or another box on the LAN, also set OLLAMA_HOST=0.0.0.0

  If this file is hosted on a domain rather than opened from disk, Chrome 142+
  also blocks it from reaching localhost until Local network access is allowed
  for the site. Opening the file locally sidesteps that entirely.

  RUNNING INSIDE AN IFRAME
  A frame cannot reach your own machine on its own account: the page around it
  owns the security policy, the origin may be opaque, and since Chrome 142 the
  local network permission has to be handed down the frame chain with
  allow="local-network-access". So the app carries two ways out, and Engines
  -> Connection drives both:

    The relay   Reopens this same file in a window of its own with #ai-relay.
                A top-level window has its own policy and can be granted access
                to your machine, so it makes the request and hands the answer
                back over postMessage. Covers every engine, including the
                in-browser one, and needs nothing installed.
    The bridge  The embedding page makes the request instead, having included
                the twenty-line snippet Connection will copy for you. Quicker,
                but it hands your keys to that page, so it stays off until you
                allow it for that origin.

  Best of all, embed it like this and neither is needed:
    <iframe src="ai-council.html"
            allow="local-network-access; loopback-network; local-network; microphone">
  and start Ollama with OLLAMA_ORIGINS=* so it answers a page it did not serve.
-->

/* ============================================================
   AI COUNCIL — the gilded chamber
   Near-black timber, brass and candlelight. Gold is the only
   accent; category pills are the one place other hues appear.
   ============================================================ */
:root{
  --void:#070707;
  --chamber:#0C0D0C;
  --panel:rgba(23,24,22,.72);
  --panel-solid:#171816;
  --panel-2:#1F201C;
  --line:rgba(191,141,65,.20);
  --line-soft:rgba(191,141,65,.11);
  --gold:#BF8D41;
  --gold-hi:#E6C98A;
  --gold-lo:#7A5A28;
  --amber:#D7B181;
  --cream:#E6D5BB;
  --cream-2:rgba(230,213,187,.62);
  --cream-3:rgba(230,213,187,.38);
  --earth:#C4685A;
  --ok:#7FA86B;
  --paper:#E7E0CD;
  --paper-2:#D3CBB3;
  --paper-3:#BDB49A;
  --pink:#211E17;
  --pink-2:#5C5545;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--cream);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(191,141,65,.3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(191,141,65,.5)}

/* ---------------------------------------------- chamber backdrop */
#chamber{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#chamber svg{width:100%;height:100%;display:block}
.flicker{animation:flick 6s ease-in-out infinite}
.flicker.b{animation-duration:7.5s;animation-delay:-2s}
.flicker.c{animation-duration:9s;animation-delay:-4s}
@keyframes flick{0%,100%{opacity:.92}42%{opacity:1}67%{opacity:.84}}

/* ---------------------------------------------- type devices */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.eyebrow.dim{color:rgba(191,141,65,.55)}
.mono{font-family:var(--mono);font-size:11.5px}

/* ---------------------------------------------- shell */
#app{
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  height:100dvh;height:100vh;max-width:100vw;overflow-x:hidden;position:relative;z-index:1;
}
#app > *{min-width:0}
/* Explicit rows matter: the controls bar is display:none until the council
   sits, and without these the remaining children slide up a row and the
   footer gets pushed off the bottom of the screen. */
header.masthead{grid-row:1}
section.bench{grid-row:2}
section.controls{grid-row:3}
main.floor{grid-row:4}
footer.chair{grid-row:5}

/* panel chrome with corner ticks */
.panel{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4) inset;
}
.panel::before,.panel::after{
  content:"";position:absolute;width:11px;height:11px;pointer-events:none;
  border-color:rgba(191,141,65,.55);border-style:solid;border-width:0;
}
.panel::before{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px;border-top-left-radius:var(--r)}
.panel::after{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px;border-bottom-right-radius:var(--r)}

/* ---------------------------------------------- masthead */
header.masthead{
  display:flex;align-items:center;gap:16px;padding:12px 24px;position:relative;z-index:30;
  background:linear-gradient(180deg,rgba(10,10,9,.95),rgba(10,10,9,.72));
  border-bottom:1px solid rgba(191,141,65,.34);
  box-shadow:0 1px 0 rgba(230,201,138,.1),0 10px 30px rgba(0,0,0,.5);
}
.crest{width:76px;height:76px;flex:none;display:block;position:relative}
.crest svg{width:100%;height:100%;display:block}
/* The seal is a raster image, so it gets the same clipped corners and candle
   glow the drawn crest had, and no more. */
.crest img{
  width:100%;height:100%;display:block;border-radius:23%;
  box-shadow:0 0 0 1px rgba(191,141,65,.28),0 4px 16px rgba(0,0,0,.62),0 0 26px rgba(191,141,65,.15);
}
.wordmark{display:flex;flex-direction:column;min-width:0}
.wordmark b{
  font-family:var(--serif);font-size:31px;font-weight:600;letter-spacing:.14em;line-height:1;
  text-transform:uppercase;
  background:linear-gradient(180deg,#F8EFDB 0%,#E3D2AE 60%,#C6A469 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 14px rgba(191,141,65,.2);
}
.chamber-rule{display:flex;align-items:center;gap:9px;margin-top:6px}
.chamber-rule span{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.chamber-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(191,141,65,.55));max-width:44px}
.chamber-rule i:last-child{background:linear-gradient(270deg,transparent,rgba(191,141,65,.55))}
.masthead .spacer{flex:1}
.mast-btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid rgba(191,141,65,.34);
  border-radius:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--cream-2);background:rgba(255,255,255,.02);white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s;
}
.mast-btn:hover{background:rgba(191,141,65,.13);border-color:rgba(191,141,65,.7);color:var(--gold-hi);box-shadow:0 0 18px rgba(191,141,65,.16)}
.mast-btn.key-on{border-color:rgba(127,168,107,.45)}
.mast-btn svg{width:17px;height:17px;flex:none}

/* ---------------------------------------------- the bench */
section.bench{padding:10px 24px 0;position:relative;z-index:20}
.bench-inner{max-width:1600px;margin:0 auto}
.bench-inner{padding:8px 11px 8px}
.bench-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bench-head .bicon{width:17px;height:17px;color:var(--gold);flex:none}
.bench-head .eyebrow{font-family:var(--serif);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--cream)}
.bench-head .count{margin-left:auto;font-size:12px;color:var(--gold);letter-spacing:.03em}
.seats{display:flex;gap:11px;overflow-x:auto;overflow-y:hidden;min-width:0;padding-bottom:2px;scrollbar-width:thin}
.seats::-webkit-scrollbar{height:4px}
.seats::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--gold),var(--gold-lo));border-radius:3px}

.seat{
  flex:1 1 0;min-width:186px;border-radius:6px;padding:6px 9px;position:relative;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(38,37,32,.9),rgba(22,22,19,.9));
  border:1px solid rgba(191,141,65,.24);transition:border-color .2s,box-shadow .3s;
}
.seat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.seat-line{display:flex;align-items:center;gap:6px;min-width:0}
.seat-line.sub{gap:5px}
.seat.floor{
  border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(191,141,65,.3),0 0 34px rgba(191,141,65,.3),0 0 90px rgba(191,141,65,.1);
  background:linear-gradient(180deg,rgba(58,49,29,.95),rgba(30,26,17,.95));
}
.seat.muted{opacity:.45}
.seat-glyph{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;
  border:1px solid rgba(191,141,65,.35);background:rgba(0,0,0,.35);overflow:hidden;
}
.seat-glyph img{width:100%;height:100%;object-fit:cover}
.seat-name{
  flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--cream);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent;padding-bottom:1px;
}
.seat-name:hover{border-bottom-color:rgba(191,141,65,.55)}
.seat-x{padding:2px;flex:none;color:rgba(230,213,187,.3);line-height:0}
.seat-x:hover{color:var(--earth)}
.seat-x svg{width:13px;height:13px}
.provmark{width:13px;height:13px;flex:none;display:block}
.seat-model{
  font-family:var(--mono);font-size:10px;color:var(--cream-3);flex:1 1 auto;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.seat-model:hover{color:var(--gold-hi)}
.seat-tag{
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border-radius:3px;flex:none;
  background:rgba(191,141,65,.1);border:1px solid rgba(191,141,65,.24);color:rgba(214,178,112,.95);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seat-tag.persona{background:rgba(196,104,90,.12);border-color:rgba(196,104,90,.3);color:#E0A090}
.seat-cfg{margin-left:auto;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(191,141,65,.65);padding:2px}
.seat-cfg:hover{color:var(--gold-hi)}
.floor-tag{
  flex:none;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#161009;padding:2px 6px;
  border-radius:3px;font-weight:800;box-shadow:0 2px 9px rgba(191,141,65,.45);
}

/* empty + add slots */
.seat.add{
  border:1px dashed rgba(191,141,65,.55);background:rgba(191,141,65,.045);
  flex-direction:row;align-items:center;justify-content:center;gap:9px;
  min-height:0;color:var(--gold);
}
.seat.add:hover{border-color:var(--gold-hi);background:rgba(191,141,65,.1);box-shadow:0 0 26px rgba(191,141,65,.14)}
.seat.add .ring{
  width:32px;height:32px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;
  font-size:19px;line-height:0;color:var(--gold);
}
.seat.add:hover .ring{border-color:var(--gold-hi);color:var(--gold-hi)}
.seat.add .lbl{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;font-weight:700}
.seat.vacant{
  border:1px solid rgba(191,141,65,.13);background:rgba(255,255,255,.012);
  flex-direction:row;align-items:center;justify-content:center;gap:9px;
  min-height:0;cursor:pointer;
}
.seat.vacant:hover{border-color:rgba(191,141,65,.4);background:rgba(191,141,65,.05)}
.seat.vacant .bust{width:32px;height:32px;flex:none;opacity:.85;transition:opacity .2s}
.seat.vacant:hover .bust{opacity:1}
.seat.vacant .lbl{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:rgba(230,213,187,.28)}
.seat.vacant:hover .lbl{color:rgba(230,213,187,.5)}

/* ---------------------------------------------- controls */
section.controls{
  display:flex;align-items:center;gap:9px;padding:12px 24px 0;flex-wrap:wrap;position:relative;z-index:15;
}
.controls.hidden{display:none}
.cbtn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:5px;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  border:1px solid rgba(191,141,65,.3);color:var(--cream-2);background:rgba(20,20,18,.75);
  backdrop-filter:blur(6px);
}
.cbtn:hover{background:rgba(191,141,65,.14);border-color:var(--gold);color:var(--gold-hi)}
.cbtn.go{border-color:rgba(127,168,107,.5);color:#A9CDA3}
.cbtn.stop{border-color:rgba(196,104,90,.5);color:#E0A090}
.cbtn svg{width:12px;height:12px}
.turnpill{
  margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold);
  border:1px solid rgba(191,141,65,.28);padding:6px 13px;border-radius:5px;background:rgba(20,20,18,.75);
}
.sitting-dot{
  width:7px;height:7px;border-radius:50%;background:var(--earth);display:inline-block;margin-right:7px;
  box-shadow:0 0 9px var(--earth);animation:bell 1.6s ease-in-out infinite;
}
@keyframes bell{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------------------------------------------- the floor */
main.floor{overflow-y:auto;overflow-x:hidden;padding:16px 24px 24px;position:relative;min-width:0}
#floorInner{min-width:0}

/* ---- empty state, wide ---- */
.hero{max-width:1180px;margin:0 auto;padding:26px 0 8px;text-align:center}
.hero .temple{width:92px;height:60px;margin:0 auto 18px;display:block;color:var(--gold)}
.hero h2{
  font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:.012em;margin:0 0 14px;
  color:#EBDCC1;text-shadow:0 3px 30px rgba(191,141,65,.22);
}
.diamond{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 16px;max-width:210px}
.diamond i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(191,141,65,.6))}
.diamond i:last-child{background:linear-gradient(270deg,transparent,rgba(191,141,65,.6))}
.diamond b{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:none}
.hero p{margin:0 auto 30px;max-width:520px;color:var(--cream-2);font-size:16px;line-height:1.62}

.motion-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;max-width:1000px;margin:0 auto}
.mcard{
  text-align:left;padding:16px 18px 15px;border-radius:6px;border:1px solid rgba(191,141,65,.18);
  background:linear-gradient(180deg,rgba(24,25,23,.85),rgba(15,16,14,.85));
  backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:12px;min-height:150px;
  transition:border-color .2s,transform .2s,box-shadow .25s;
}
.mcard:hover{border-color:rgba(191,141,65,.6);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 24px rgba(191,141,65,.1)}
.mcard .q{font-family:var(--serif);font-size:19px;line-height:1.4;color:#E9DCC4;flex:1}
.mcard .go{align-self:flex-end;color:var(--gold);line-height:0}
.mcard .go svg{width:20px;height:20px}
.mcard:hover .go{color:var(--gold-hi)}
.pill{
  align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 10px;border-radius:11px;border:1px solid;
  color:var(--pc);border-color:color-mix(in srgb,var(--pc) 40%,transparent);
  background:color-mix(in srgb,var(--pc) 13%,transparent);
}
@supports not (color:color-mix(in srgb,red 10%,transparent)){
  .pill{border-color:rgba(191,141,65,.35);background:rgba(191,141,65,.12)}
}

/* ---- empty state, narrow: "Choose a motion" panel ---- */
.motion-list{display:none;max-width:760px;margin:0 auto}
.ml-inner{padding:18px 18px 20px}
.ml-head{display:flex;align-items:center;gap:13px;margin-bottom:5px}
.ml-head .ring{
  width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(191,141,65,.45);
  display:grid;place-items:center;color:var(--gold);background:rgba(191,141,65,.06);
}
.ml-head .ring svg{width:23px;height:23px}
.ml-head h2{font-family:var(--serif);font-size:29px;font-weight:600;margin:0;color:#EBDCC1;letter-spacing:.01em}
.ml-sub{color:var(--cream-3);font-size:14px;margin:0 0 15px 57px}
.mrow{
  width:100%;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:6px;
  border:1px solid rgba(191,141,65,.13);background:rgba(255,255,255,.018);margin-bottom:9px;
  text-align:left;transition:border-color .18s,background .18s;
}
.mrow:hover{border-color:rgba(191,141,65,.45);background:rgba(191,141,65,.06)}
.mrow .pill{align-self:center;flex:none;min-width:96px;text-align:center}
.mrow .q{flex:1;font-size:16px;line-height:1.42;color:#E4D6BD}
.mrow .go{
  width:33px;height:33px;flex:none;border-radius:50%;border:1px solid rgba(191,141,65,.45);
  display:grid;place-items:center;color:var(--gold);line-height:0;
}
.mrow:hover .go{border-color:var(--gold-hi);color:var(--gold-hi);background:rgba(191,141,65,.12)}
.mrow .go svg{width:15px;height:15px}

/* ---------------------------------------------- Hansard record */
.record{
  max-width:900px;margin:0 auto;background:var(--paper);color:var(--pink);border-radius:4px;
  position:relative;border:1px solid rgba(191,141,65,.5);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 26px 60px rgba(0,0,0,.68);
}
.record-head{display:flex;align-items:baseline;gap:11px;padding:11px 20px 9px;border-bottom:2px solid var(--pink)}
.record-head b{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--pink)}
.record-head span{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--pink-2)}
.record-head .rh-r{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--pink-2)}
.record-body{padding:0 0 14px}
.motion{padding:17px 24px 16px;border-bottom:1px solid var(--paper-3);background:linear-gradient(180deg,rgba(191,141,65,.1),transparent)}
.motion .lbl{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96682B;font-weight:700;margin-bottom:6px}
.motion p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.42;color:var(--pink);font-style:italic}
.motion .who{margin-top:7px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--pink-2)}
.entry{display:grid;grid-template-columns:54px 1fr;padding:14px 24px 14px 0;border-bottom:1px solid rgba(189,180,154,.55);position:relative}
.entry:last-child{border-bottom:none}
.entry .gutter{border-right:1px solid var(--paper-3);padding-right:10px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--pink-2);padding-top:3px}
.entry .gutter .n{display:block;font-size:12px;color:var(--pink);font-weight:600}
.entry .gutter .t{display:block;font-size:9px;margin-top:2px;opacity:.7}
.entry .said{padding-left:15px;min-width:0}
.said-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.said-name{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.said-swatch{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.3)}
.said-model{font-family:var(--mono);font-size:9.5px;color:var(--pink-2)}
.said-role{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink-2);border:1px solid var(--paper-3);padding:1px 6px;border-radius:3px}
.said-text{font-family:var(--serif);font-size:16.5px;line-height:1.56;color:var(--pink);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.said-text.err{color:#8E3520;font-style:italic;font-size:14px}
.said-portrait{float:right;width:68px;height:68px;margin:0 0 8px 13px;border-radius:3px;object-fit:cover;border:1px solid var(--paper-3);filter:sepia(.2) contrast(1.03)}
.said-tools{display:flex;gap:13px;margin-top:8px;flex-wrap:wrap;align-items:center}
.tool{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink-2);display:inline-flex;align-items:center;gap:5px;border-bottom:1px solid transparent;padding-bottom:1px}
.tool:hover{color:#96682B;border-bottom-color:#96682B}
.tool.on{color:#96682B;border-bottom-color:#96682B}
.tool svg{width:11px;height:11px}
.entry.chair{background:rgba(196,104,90,.07)}
.entry.chair .said-name{color:#A3402F}
.entry.thinking .said-text{color:var(--pink-2);font-style:italic}
.pen{display:inline-flex;gap:3px;vertical-align:middle;margin-left:5px}
.pen i{width:4px;height:4px;border-radius:50%;background:var(--pink-2);animation:pen 1.3s ease-in-out infinite}
.pen i:nth-child(2){animation-delay:.18s}
.pen i:nth-child(3){animation-delay:.36s}
@keyframes pen{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.callto{padding:15px 24px;border-top:1px solid var(--paper-3);background:rgba(191,141,65,.1)}
.callto .lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-2);margin-bottom:9px}
.callto .opts{display:flex;gap:8px;flex-wrap:wrap}
.callto button{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--paper-3);border-radius:4px;background:rgba(255,255,255,.45);color:var(--pink)}
.callto button:hover{border-color:#96682B;background:rgba(191,141,65,.14)}
.callto .cn{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}

/* ---------------------------------------------- the chair */
footer.chair{padding:0 24px 10px;position:relative;z-index:25}
.chair-wrap{
  padding:7px 18px;max-width:1230px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
}
.chair-col{flex:1;min-width:0}
.quill{
  width:36px;height:36px;flex:none;border-radius:50%;border:1px solid rgba(191,141,65,.4);
  display:grid;place-items:center;color:var(--gold);background:rgba(191,141,65,.05);
}
.quill svg{width:17px;height:17px}
.chair-lbl{display:flex;align-items:center;gap:11px;margin-bottom:4px;min-width:0}
.chair-lbl .eyebrow{font-size:10.5px;letter-spacing:.22em;flex:none}
.chair-input{display:flex;gap:11px;align-items:stretch}
.chair-input textarea{
  flex:1;min-width:0;background:rgba(0,0,0,.42);border:1px solid rgba(191,141,65,.2);border-radius:5px;
  padding:11px 14px;resize:none;font-family:var(--sans);font-size:15px;line-height:1.4;
  color:#EFE4CE;min-height:42px;max-height:110px;
}
.chair-input textarea::placeholder{color:rgba(230,213,187,.3)}
.chair-input textarea:focus{border-color:var(--gold);background:rgba(0,0,0,.55);outline:none;box-shadow:0 0 0 3px rgba(191,141,65,.09)}
.mic{
  width:46px;flex:none;border:1px solid rgba(191,141,65,.28);border-radius:5px;display:grid;place-items:center;
  color:rgba(191,141,65,.85);background:rgba(0,0,0,.3);
}
.mic:hover{border-color:var(--gold);color:var(--gold-hi);background:rgba(191,141,65,.1)}
.mic.live{border-color:var(--earth);color:#E8A292;background:rgba(196,104,90,.2);animation:bell 1.2s infinite}
.mic svg{width:19px;height:19px}
.put{
  padding:0 30px;flex:none;border-radius:5px;border:1px solid #E0C489;
  background:linear-gradient(180deg,#EBCD8E 0%,#D3A757 46%,#B98B3C 100%);
  color:#241905;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 16px rgba(191,141,65,.32),0 1px 0 rgba(255,240,205,.6) inset;
  transition:filter .16s,transform .1s,box-shadow .2s;
}
.put svg{width:17px;height:17px}
.put:hover:not(:disabled){filter:brightness(1.09);box-shadow:0 6px 24px rgba(191,141,65,.45),0 1px 0 rgba(255,240,205,.7) inset}
.put:active:not(:disabled){transform:translateY(1px)}
.put:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.35)}
.chair-foot{
  display:flex;align-items:center;gap:7px;margin-left:auto;font-size:11px;color:var(--cream-3);
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.chair-foot > span{overflow:hidden;text-overflow:ellipsis}
.chair-foot svg{width:13px;height:13px;flex:none;opacity:.7}

/* ---------------------------------------------- modals */
.scrim{position:fixed;inset:0;background:rgba(5,5,4,.84);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:18px;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:690px;max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1C1D19,#121310);border:1px solid rgba(191,141,65,.35);
  border-radius:var(--r);box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.5) inset;overflow:hidden;
}
.sheet.wide{max-width:820px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid rgba(191,141,65,.34);background:rgba(0,0,0,.3);flex:none}
.sheet-head h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.03em;color:#EBDCC1}
.sheet-head .x{margin-left:auto;color:rgba(230,213,187,.45);line-height:0;padding:4px}
.sheet-head .x:hover{color:var(--earth)}
.sheet-head .x svg{width:18px;height:18px}
.tabs{display:flex;border-bottom:1px solid var(--line-soft);flex:none;background:rgba(0,0,0,.2)}
.tabs button{flex:1;padding:11px 6px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:rgba(230,213,187,.45);border-bottom:2px solid transparent}
.tabs button:hover{color:var(--cream);background:rgba(191,141,65,.06)}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold);background:rgba(191,141,65,.1)}
.sheet-body{padding:18px 20px 22px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:9px;justify-content:flex-end;background:rgba(0,0,0,.3);flex:none;flex-wrap:wrap}

/* ---------------------------------------------- forms */
.field{margin-bottom:15px}
.field > label,.flabel{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:6px}
.hint{font-size:11.5px;color:var(--cream-3);line-height:1.48;margin-top:5px}
.hint code{font-family:var(--mono);font-size:10.5px;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:3px;color:var(--gold-hi)}
input[type=text],input[type=password],input[type=number],select,textarea.ta{
  width:100%;background:rgba(0,0,0,.42);border:1px solid rgba(191,141,65,.22);border-radius:5px;
  padding:9px 11px;color:#EFE4CE;font-size:14px;
}
input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus,textarea.ta:focus{border-color:var(--gold);outline:none;background:rgba(0,0,0,.55)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgba(191,141,65,.75) 50%),linear-gradient(135deg,rgba(191,141,65,.75) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
select option{background:#1C1D19;color:#EFE4CE}
textarea.ta{resize:vertical;min-height:62px;font-family:var(--sans)}
.row{display:flex;gap:11px}
.row > *{flex:1;min-width:0}
.inline{display:flex;gap:8px;align-items:center}
.reveal{position:relative}
.reveal input{padding-right:46px}
.reveal .eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:rgba(191,141,65,.6);line-height:0;padding:4px}
.reveal .eye:hover{color:var(--gold-hi)}
.reveal .eye svg{width:15px;height:15px}
.btn{padding:9px 16px;border:1px solid rgba(191,141,65,.35);border-radius:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--cream-2);background:rgba(255,255,255,.02);white-space:nowrap}
.btn:hover{background:rgba(191,141,65,.14);border-color:var(--gold);color:var(--gold-hi)}
.btn.primary{border-color:#E0C489;background:linear-gradient(180deg,#EBCD8E,#C79A48);color:#241905}
.btn.primary:hover{filter:brightness(1.08);color:#241905}
.btn.danger{border-color:rgba(196,104,90,.45);color:#E0A090}
.btn.danger:hover{background:rgba(196,104,90,.16);border-color:var(--earth);color:#F0BCAE}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:8px}
.choice{text-align:left;padding:9px 11px;border:1px solid rgba(191,141,65,.2);border-radius:5px;background:rgba(255,255,255,.02)}
.choice:hover{border-color:rgba(191,141,65,.5);background:rgba(191,141,65,.07)}
.choice.on{border-color:var(--gold);background:rgba(191,141,65,.15)}
.choice b{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--cream);margin-bottom:2px}
.choice small{display:block;font-size:10.5px;color:var(--cream-3);line-height:1.36}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px}
.glyphbtn{aspect-ratio:1;display:grid;place-items:center;font-size:21px;border:1px solid rgba(191,141,65,.2);border-radius:5px;background:rgba(255,255,255,.02)}
.glyphbtn:hover{border-color:rgba(191,141,65,.5);background:rgba(191,141,65,.09)}
.glyphbtn.on{border-color:var(--gold);background:rgba(191,141,65,.18);transform:scale(1.06)}
.glyphbtn:disabled{opacity:.25;cursor:not-allowed}
.switchrow{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border:1px solid rgba(191,141,65,.16);border-radius:5px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.015)}
.switchrow:hover{border-color:rgba(191,141,65,.4);background:rgba(191,141,65,.05)}
.switchrow input{accent-color:var(--gold);margin-top:3px;flex:none;width:15px;height:15px}
.switchrow b{display:block;font-size:12.5px;color:#EFE4CE;font-weight:600;margin-bottom:1px}
.switchrow small{font-size:11px;color:var(--cream-3);line-height:1.42}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:rgba(191,141,65,.28);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #16150F}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #16150F}
.rangewrap{display:flex;align-items:center;gap:11px}
.rangewrap .val{font-family:var(--mono);font-size:11px;color:var(--gold);min-width:64px;text-align:right}
.pgroup{margin-bottom:13px}
.pgroup .gname{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:rgba(191,141,65,.6);margin-bottom:7px;font-weight:700}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{padding:6px 10px;border:1px solid rgba(196,104,90,.28);border-radius:3px;background:rgba(196,104,90,.07);font-size:11.5px;color:#E2C4B6;display:inline-flex;gap:6px;align-items:center}
.pchip:hover{border-color:#D08573;background:rgba(196,104,90,.18);color:#FBE7DC}
.pcard{border:1px solid rgba(196,104,90,.32);border-radius:5px;padding:15px;background:rgba(196,104,90,.07)}
.pcard h4{margin:0 0 3px;font-family:var(--serif);font-size:20px;color:#F2DCCF;font-weight:600}
.pcard .era{font-family:var(--mono);font-size:10px;color:rgba(224,160,144,.85);margin-bottom:8px}
.pcard p{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--cream-2)}
.pcard .traits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pcard .traits span{font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(196,104,90,.18);border:1px solid rgba(196,104,90,.28);color:#E2C4B6}
.pcard dl{margin:0 0 10px;font-size:12px;line-height:1.5}
.pcard dt{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(224,160,144,.8);margin-top:8px;font-weight:700}
.pcard dd{margin:2px 0 0;color:var(--cream-2)}
.pcard .portrait{float:right;width:76px;height:76px;border-radius:3px;object-fit:cover;margin:0 0 8px 13px;border:1px solid rgba(196,104,90,.4)}
.note{border-left:2px solid var(--gold);padding:9px 12px;background:rgba(191,141,65,.07);font-size:12px;line-height:1.52;color:var(--cream-2);border-radius:0 5px 5px 0;margin-bottom:13px}
.note.warn{border-left-color:#C79A48;background:rgba(199,154,72,.09)}
.note.bad{border-left-color:var(--earth);background:rgba(196,104,90,.1);color:#E5BDB1}
.note.good{border-left-color:var(--ok);background:rgba(127,168,107,.09)}
.note b{color:#EFE4CE}
.divider{height:1px;background:var(--line-soft);margin:17px 0}
.divider.labelled{display:flex;align-items:center;gap:11px;height:auto;background:none;margin:19px 0 14px}
.divider.labelled::before,.divider.labelled::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.divider.labelled span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(191,141,65,.65);font-weight:700}
#toasts{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:10px 14px;border-radius:5px;border:1px solid rgba(191,141,65,.4);background:rgba(24,24,20,.97);box-shadow:0 12px 34px rgba(0,0,0,.65);font-size:12.5px;line-height:1.45;animation:slidein .2s ease-out;color:var(--cream)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.bad{border-color:rgba(196,104,90,.6);color:#EEC0B0}
.toast.good{border-color:rgba(127,168,107,.6);color:#BBD8B6}
.toast.out{opacity:0;transform:translateX(14px);transition:all .25s}
.prog{height:3px;background:rgba(191,141,65,.18);border-radius:2px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
pre.brief{font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(0,0,0,.45);border:1px solid rgba(191,141,65,.18);border-radius:5px;padding:12px 14px;margin:0 0 13px;color:#CEC3AC}
.keystat{display:flex;align-items:center;gap:8px;font-size:11px;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:rgba(230,213,187,.22)}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(127,168,107,.7)}
.dot.bad{background:var(--earth);box-shadow:0 0 8px rgba(196,104,90,.65)}
.dot.warn{background:#C79A48;box-shadow:0 0 8px rgba(199,154,72,.55)}
.vstat{font-size:11px;letter-spacing:.01em;color:var(--cream-3)}
.vstat.ok{color:#A9CDA3}
.vstat.bad{color:#E29A80}
.vstat.warn{color:#D9B473}
.vaultbar{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:13px;
  border:1px solid rgba(191,141,65,.22);border-left:2px solid var(--gold);
  border-radius:0 5px 5px 0;padding:10px 13px;background:rgba(191,141,65,.06);
}
.vaultbar .grow{flex:1 1 220px;min-width:0;font-size:12px;line-height:1.5;color:var(--cream-2)}
.vaultbar .switchrow{margin:0;padding:7px 11px;flex:none}
.vaultbar .switchrow span{font-size:12px;color:var(--cream-2)}

/* ---------------------------------------------- the wire */
.wire-card{border:1px solid rgba(201,162,77,.18);border-radius:3px;padding:12px 13px;margin-bottom:10px}
.wire-card h4{font-size:13px;color:#F0E7CF;letter-spacing:.02em;margin:0 0 7px;font-weight:600}
.wire-log{font-family:var(--mono);font-size:11px;line-height:1.6;max-height:220px;overflow:auto;background:rgba(0,0,0,.45);border:1px solid rgba(191,141,65,.18);border-radius:5px;padding:10px 12px;color:#CEC3AC}
.wire-log b{color:#EFE4CE;font-weight:600}
.wire-log .ok{color:#A9CDA3}
.wire-log .bad{color:#E29A80}
.wire-pick{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.wire-pick button{padding:6px 11px;border:1px solid rgba(191,141,65,.28);border-radius:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--cream-3);background:rgba(255,255,255,.02)}
.wire-pick button:hover{border-color:rgba(191,141,65,.55);color:var(--cream-2)}
.wire-pick button.on{border-color:#E0C489;background:rgba(191,141,65,.17);color:#F0E7CF}
.snip{margin:9px 0 0}
.snip pre{font-family:var(--mono);font-size:10.5px;line-height:1.5;white-space:pre;overflow:auto;background:rgba(0,0,0,.5);border:1px solid rgba(191,141,65,.18);border-radius:5px;padding:11px 12px;margin:0 0 7px;color:#CEC3AC;max-height:210px}
.relay-wrap{max-width:520px;margin:0 auto;padding:32px 22px 44px;height:100dvh;height:100vh;overflow:auto;box-sizing:border-box}
.relay-lede{font-size:13px;line-height:1.62;color:var(--cream-2);margin:10px 0 0}

/* ---------------------------------------------- responsive */
@media (max-width:1080px){
  .hero h2{font-size:36px}
  .motion-cards{grid-template-columns:1fr;max-width:640px}
  .mcard{min-height:0;flex-direction:row;align-items:center;gap:15px}
  .mcard .pill{align-self:center;min-width:104px;text-align:center}
  .mcard .q{font-size:17px}
}
/* Tablet and below: the stacked "Choose a motion" layout. */
@media (max-width:860px){
  header.masthead{padding:6px 12px;gap:10px}
  .crest{width:41px;height:41px}
  .wordmark b{font-size:19px;letter-spacing:.1em}
  .chamber-rule{margin-top:3px;gap:6px}
  .chamber-rule span{font-size:7.5px;letter-spacing:.24em}
  .chamber-rule i{max-width:16px}
  .mast-btn span.lbl{display:none}
  .mast-btn{padding:9px 10px}
  .mast-btn svg{width:16px;height:16px}

  section.bench{padding:7px 12px 0}
  .bench-inner{padding:8px 10px 9px}
  .bench-head{margin-bottom:6px;gap:7px}
  .bench-head .eyebrow{font-size:11.5px;letter-spacing:.15em}
  .bench-head .count{font-size:10.5px}
  .seats{gap:7px}
  .seat{min-width:168px;flex:0 0 168px;padding:6px 8px;gap:7px}
  .seat-glyph{width:28px;height:28px;font-size:14px}
  .seat .seat-cfg{display:none}
  .seat.add,.seat.vacant{min-width:132px;flex:0 0 132px;gap:8px}
  .seat.add .ring{width:27px;height:27px;font-size:17px}
  .seat.add .lbl,.seat.vacant .lbl{font-size:8.5px;letter-spacing:.13em}
  .seat.vacant .bust{width:27px;height:27px}

  section.controls{padding:10px 12px 0}
  main.floor{padding:11px 12px 16px}
  .hero,.motion-cards{display:none}
  .motion-list{display:block}
  .ml-inner{padding:13px 13px 14px}
  .ml-head{gap:11px;margin-bottom:4px}
  .ml-head .ring{width:38px;height:38px}
  .ml-head .ring svg{width:20px;height:20px}
  .ml-head h2{font-size:25px}
  .ml-sub{margin:0 0 12px 49px;font-size:12.5px}
  .mrow{gap:11px;padding:9px 12px;margin-bottom:7px}
  .mrow .pill{min-width:88px;font-size:8.5px;padding:3px 7px;letter-spacing:.13em}
  .mrow .q{font-size:14px}
  .mrow .go{width:29px;height:29px}
  .mrow .go svg{width:13px;height:13px}

  footer.chair{padding:0 12px 9px}
  .chair-wrap{
    display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"q l" "i i";gap:0 10px;align-items:center;padding:8px 11px;
  }
  .chair-wrap > .quill{grid-area:q;width:30px;height:30px}
  .chair-wrap > .quill svg{width:15px;height:15px}
  .chair-col{display:contents}
  .chair-lbl{grid-area:l;margin:0;gap:9px}
  .chair-lbl .eyebrow{font-size:9.5px;letter-spacing:.18em}
  .chair-input{grid-area:i;margin-top:7px;gap:8px}
  .chair-input textarea{min-height:42px;padding:10px 12px;font-size:14px}
  .mic{width:42px}
  .mic svg{width:16px;height:16px}
  .put{padding:0 15px;font-size:10.5px;letter-spacing:.11em;gap:7px}
  .put svg{width:14px;height:14px}
  .chair-foot{font-size:10px}
  .chair-foot svg{width:12px;height:12px}
}
/* Phone: one thing per line. */
@media (max-width:480px){
  .ml-head h2{font-size:21px}
  .ml-sub{margin-left:0;font-size:12px}
  .mrow{flex-wrap:wrap;gap:9px}
  .mrow .pill{min-width:0}
  .mrow .q{flex:1 1 100%;order:3;font-size:14.5px}
  .mrow .go{margin-left:auto}
  .entry{grid-template-columns:38px 1fr;padding-right:14px}
  .entry .gutter{padding-right:8px}
  .entry .said{padding-left:10px}
  .said-text{font-size:15.5px}
  .motion{padding:13px 15px}
  .motion p{font-size:16px}
  .record-head{padding:9px 14px 8px}
  .chair-foot{display:none}
  .chair-input textarea{font-size:13.5px}
  .put{padding:0 11px;font-size:10px;letter-spacing:.08em;gap:5px}
  .choices{grid-template-columns:1fr 1fr}
  .sheet-foot{justify-content:stretch}
  .sheet-foot .btn{flex:1;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

  <defs>
    <radialGradient id="core" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#241B10"/><stop offset="38%" stop-color="#140F09"/>
      <stop offset="78%" stop-color="#0A0806"/><stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FFE3B0" stop-opacity=".9"/>
      <stop offset="18%" stop-color="#F0B863" stop-opacity=".42"/>
      <stop offset="52%" stop-color="#C9822E" stop-opacity=".14"/>

<script>
"use strict";
/* ============================================================================
   AI COUNCIL — single-file, offline-first.
   Port of the React/Vite/Supabase "AI Council" app.
   Engines: Ollama (default) · WebLLM (in-browser) · OpenAI · Anthropic · Google
   ========================================================================== */

/* ---------------------------------------------------------------- helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nowTime = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function toast(msg, kind) {
  const tray = $('#toasts');
  if (!tray) { console.log('[council]', msg); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  tray.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, kind === 'bad' ? 6500 : 3800);
}

const LS = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('storage full', e); } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

/* ==========================================================================
   THE WIRE — reaching an engine when this page is not the top window.

   An iframe is a different country from a tab. Three separate gates can stop
   a request that works perfectly when the file is opened on its own:

     1 · Content Security Policy. A frame written with srcdoc, blob: or data:
         inherits the host page's connect-src. If the host does not list your
         Ollama address, fetch never leaves this document.
     2 · An opaque origin. A sandboxed frame sends Origin: null, and Ollama
         refuses that unless it was started with OLLAMA_ORIGINS=*.
     3 · Local Network Access. Since Chrome 142 the *embedding* page has to
         hand the permission down with allow="local-network-access", and every
         frame in the chain must pass it on. A frame cannot grant it to itself.

   None of the three can be argued with from inside the frame, so the app
   carries two ways out and uses whichever is available:

     RELAY  — this same file, reopened in a window of its own. A top-level
              window has its own CSP, its own origin, and can be given the
              local network permission, so it reaches Ollama when the frame
              cannot. It makes the request and hands the answer back over
              postMessage. Nothing is installed and nothing is hosted.
     BRIDGE — the page doing the embedding makes the request instead, having
              volunteered by including twenty lines of script. Faster than the
              relay and needs no second window, but it means handing your
              request, API key and all, to that page — so it is never used
              until you allow it, per origin.

   Everything above this layer calls Net.fetch and never learns which road the
   request took.
   ========================================================================== */
const WIRE = 'dv-ai-wire';
const WIRE_V = 1;
const RELAY_HASH = 'ai-relay';

function copyText(s, what) {
  const ok = () => toast((what || 'Text') + ' copied.', 'good');
  const no = () => toast('The clipboard is blocked here \u2014 select the text and copy it by hand.', 'bad');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(ok, no); return; }
  } catch (e) {}
  no();
}

/* ------------------------------------------------ where this page is running */
const Frame = {
  embedded: (() => { try { return window.self !== window.top; } catch (e) { return true; } })(),
  storageOK: (() => {
    try { localStorage.setItem('dv.wire.probe', '1'); localStorage.removeItem('dv.wire.probe'); return true; }
    catch (e) { return false; }
  })(),
  opaque: (() => { try { return window.origin === 'null' || location.origin === 'null'; } catch (e) { return true; } })(),
  popupsOK: true,
  /* The origin of the outermost page, when the browser will say. */
  hostOrigin: (() => {
    try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1]; } catch (e) {}
    try { if (document.referrer) return new URL(document.referrer).origin; } catch (e) {}
    return '';
  })(),
  /* An opaque origin or dead storage inside a frame means a sandbox attribute. */
  get sandboxed() { return this.embedded && (this.opaque || !this.storageOK); },
  where() {
    if (!this.embedded) return 'a window of its own';
    if (this.sandboxed) return 'a sandboxed iframe';
    return 'an iframe';
  }
};

/* Chrome will say outright whether it intends to allow local addresses. */
let lnaState = '';
(function readLNA() {
  try {
    if (!navigator.permissions || !navigator.permissions.query) return;
    navigator.permissions.query({ name: 'local-network-access' })
      .then(r => { lnaState = r.state || ''; }, () => {});
  } catch (e) {}
})();

/* ------------------------------------------------------------------ a peer */
function Peer(win, role) {
  this.win = win;
  this.role = role;            // 'relay' | 'bridge'
  this.state = 'unknown';      // unknown | ready | absent | gone
  this.pending = new Map();
  this.n = 0;
  this._hello = null;
}
Peer.prototype.alive = function () { try { return !!this.win && !this.win.closed; } catch (e) { return false; } };
Peer.prototype.post = function (msg, transfer) {
  try { this.win.postMessage(msg, '*', transfer || []); return true; } catch (e) { return false; }
};
Peer.prototype.hello = function (ms) {
  return new Promise(resolve => {
    if (!this.alive()) { this.state = 'gone'; return resolve(false); }
    const finish = ok => { clearTimeout(t); this._hello = null; resolve(ok); };
    this._hello = () => finish(true);
    const t = setTimeout(() => {
      if (this.state !== 'ready') this.state = 'absent';
      finish(this.state === 'ready');
    }, ms || 1200);
    if (!this.post({ ch: WIRE, v: WIRE_V, type: 'hello', role: 'app' })) finish(false);
  });
};
Peer.prototype.ask = function (op, payload, opts) {
  opts = opts || {};
  const self = this;
  return new Promise((resolve, reject) => {
    if (!self.alive()) { self.state = 'gone'; return reject(new Error('The ' + self.role + ' is no longer open.')); }
    const id = self.role + '-' + (++self.n);
    const ms = opts.timeout || 0;
    const timer = ms ? setTimeout(() => {
      self.settle(id, new Error('The ' + self.role + ' did not answer within ' + Math.round(ms / 1000) + ' seconds.'));
    }, ms) : 0;
    self.pending.set(id, { resolve, reject, timer, onStatus: opts.onStatus });
    const msg = Object.assign({ ch: WIRE, v: WIRE_V, type: 'ask', id, op }, payload);
    if (!self.post(msg)) self.settle(id, new Error('Could not speak to the ' + self.role + '.'));
  });
};
Peer.prototype.settle = function (id, err, val) {
  const p = this.pending.get(id);
  if (!p) return;
  this.pending.delete(id);
  if (p.timer) clearTimeout(p.timer);
  if (err) p.reject(err); else p.resolve(val);
};
Peer.prototype.dropAll = function (why) {
  Array.from(this.pending.keys()).forEach(id => this.settle(id, new Error(why)));
};

/* --------------------------------------------------------------- the links */
const Link = {
  relay: null,
  host: null,
  allow: LS.get('council.bridgeAllow', {}),
  watchers: [],
  onChange(fn) { this.watchers.push(fn); },
  changed() { this.watchers.forEach(f => { try { f(); } catch (e) {} }); },

  peerFor(src) {
    if (this.relay && this.relay.win === src) return this.relay;
    if (this.host && this.host.win === src) return this.host;
    return null;
  },

  /* ---- the embedding page ---- */
  async findHost() {
    if (!Frame.embedded) return false;
    let target = null;
    try { target = window.parent; } catch (e) { target = null; }
    if (!target || target === window) return false;
    this.host = new Peer(target, 'bridge');
    const ok = await this.host.hello(1500);
    this.changed();
    return ok;
  },
  hostReady() { return !!(this.host && this.host.state === 'ready' && this.host.alive()); },
  hostKey() { return Frame.hostOrigin || 'this page'; },
  hostAllowed() { return this.hostReady() && this.allow[this.hostKey()] === true; },
  allowHost(yes) {
    this.allow[this.hostKey()] = !!yes;
    LS.set('council.bridgeAllow', this.allow);
    this.changed();
  },

  /* ---- the relay window ---- */
  relayReady() { return !!(this.relay && this.relay.state === 'ready' && this.relay.alive()); },
  relayOpening: false,
  relayWhyNot: '',
  /* A frame written with srcdoc, blob: or data: has no address a second window
     could be opened at, so there is no relay to be had and saying so beats
     twenty seconds of knocking at a blank page. */
  relayPossible() { return /^https?:$/.test(location.protocol) || location.protocol === 'file:'; },
  async openRelay() {
    if (this.relayReady()) { try { this.relay.win.focus(); } catch (e) {} return true; }
    if (!this.relayPossible()) {
      this.relayWhyNot = 'This page was written into the frame rather than loaded from an address, so there is nothing to reopen. ' +
        'The bridge below is the way through; failing that, ask for the file to be embedded by URL.';
      this.changed();
      return false;
    }
    if (this.relayOpening) return false;
    this.relayOpening = true;
    this.changed();
    try {
      const url = location.href.split('#')[0] + '#' + RELAY_HASH;
      let w = null;
      try { w = window.open(url, 'dvAiRelay', 'width=540,height=640,menubar=no,toolbar=no,location=no'); } catch (e) { w = null; }
      if (!w) {
        Frame.popupsOK = false;
        this.relayWhyNot = 'The browser refused to open the window.';
        return false;
      }
      this.relayWhyNot = '';
      Frame.popupsOK = true;
      this.relay = new Peer(w, 'relay');
      /* The window has to load this whole file before it can answer, so knock. */
      for (let i = 0; i < 40; i++) {
        if (await this.relay.hello(500)) { this.relayWhyNot = ''; return true; }
        if (!this.relay.alive()) break;
      }
      /* It loaded but never spoke: almost always a sandbox that stripped the
         opener, so the new window has no way of answering this one. */
      if (!this.relayWhyNot) {
        this.relayWhyNot = this.relay.alive()
          ? 'The window opened but could not answer this page, which usually means the frame is sandboxed without ' +
            'allow-popups-to-escape-sandbox. The bridge below is the way through.'
          : 'The window closed before it could answer.';
      }
      return this.relayReady();
    } finally {
      this.relayOpening = false;
      this.changed();
    }
  },
  closeRelay() {
    if (this.relay) {
      try { this.relay.post({ ch: WIRE, v: WIRE_V, type: 'bye' }); } catch (e) {}
      try { this.relay.win.close(); } catch (e) {}
      this.relay.dropAll('The relay window was closed.');
      this.relay.state = 'gone';
    }
    this.changed();
  }
};

/* A relay the user closes by hand must not leave requests hanging. */
setInterval(() => {
  if (Link.relay && Link.relay.state === 'ready' && !Link.relay.alive()) {
    Link.relay.state = 'gone';
    Link.relay.dropAll('The relay window was closed.');
    Link.changed();
  }
}, 2000);

/* ------------------------------------------------------- one message router */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object' || d.ch !== WIRE || d.v !== WIRE_V) return;
  if (Relay.serving) { Relay.handle(e); return; }

  const peer = Link.peerFor(e.source);
  if (!peer) return;

  if (d.type === 'hello') {
    peer.state = 'ready';
    peer.post({ ch: WIRE, v: WIRE_V, type: 'here', role: 'app' });
    if (peer._hello) peer._hello();
    Link.changed();
    return;
  }
  if (d.type === 'here') {
    peer.state = 'ready';
    if (peer._hello) peer._hello();
    Link.changed();
    return;
  }
  if (d.type === 'bye') {
    peer.state = 'gone';
    peer.dropAll('The ' + peer.role + ' closed.');
    Link.changed();
    return;
  }
  if (d.type === 'status') {
    const p = peer.pending.get(d.id);
    if (p && p.onStatus) p.onStatus(d.text || '', d.progress || 0);
    return;
  }
  if (d.type === 'told') {
    if (d.error) peer.settle(d.id, new Error(d.error));
    else peer.settle(d.id, null, d.result);
  }
});

/* --------------------------------------------- a Response that survived the wire */
function WireResponse(r) {
  r = r || {};
  this.ok = !!r.ok;
  this.status = r.status || 0;
  this.statusText = r.statusText || '';
  this.url = r.url || '';
  this._type = r.type || '';
  this._buf = r.buf || null;
  this._text = typeof r.text === 'string' ? r.text : null;
  const ct = this._type;
  this.headers = { get(k) { return String(k).toLowerCase() === 'content-type' ? ct : null; } };
}
WireResponse.prototype.text = async function () {
  if (this._text != null) return this._text;
  if (this._buf) { this._text = new TextDecoder().decode(new Uint8Array(this._buf)); return this._text; }
  return '';
};
WireResponse.prototype.json = async function () { return JSON.parse(await this.text()); };
WireResponse.prototype.blob = async function () {
  if (this._buf) return new Blob([this._buf], { type: this._type });
  return new Blob([this._text || ''], { type: this._type });
};

/* ---------------------------------------------------------------- dispatch */
const Net = {
  mode: LS.get('council.wire', 'auto'),   // auto | direct | relay | bridge
  last: '',
  lastNote: '',
  directBadUntil: 0,

  setMode(m) { this.mode = m; LS.set('council.wire', m); this.directBadUntil = 0; Link.changed(); },

  /* Direct first while it is working; once it has failed, try the ways out
     first and keep direct at the back in case the block was lifted. */
  routes() {
    if (this.mode === 'direct') return ['direct'];
    if (this.mode === 'relay') return Link.relayReady() ? ['relay', 'direct'] : ['direct'];
    if (this.mode === 'bridge') return Link.hostAllowed() ? ['bridge', 'direct'] : ['direct'];
    const alt = [];
    if (Link.relayReady()) alt.push('relay');
    if (Link.hostAllowed()) alt.push('bridge');
    return Date.now() > this.directBadUntil ? ['direct'].concat(alt) : alt.concat(['direct']);
  },

  /* A network-level failure means the request never reached the server, so
     sending it again down another road cannot double anything up. An HTTP
     answer, however unwelcome, is an answer and is returned as it stands. */
  async fetch(url, init, opts) {
    init = init || {}; opts = opts || {};
    const routes = this.routes();
    let first = null;
    for (let i = 0; i < routes.length; i++) {
      try {
        const res = await this.send(routes[i], url, init, opts);
        this.last = routes[i];
        if (routes[i] === 'direct') this.directBadUntil = 0;
        return res;
      } catch (e) {
        if (routes[i] === 'direct') this.directBadUntil = Date.now() + 60000;
        if (!first) first = e;
      }
    }
    const err = new Error(wireFailNote(url, first));
    err.wire = true;
    this.lastNote = err.message;
    throw err;
  },

  send(route, url, init, opts) {
    if (route === 'direct') return this.direct(url, init, opts);
    const peer = route === 'relay' ? Link.relay : Link.host;
    if (!peer) return Promise.reject(new Error('No ' + route + ' is connected.'));
    let abs = url;
    try { abs = new URL(url, location.href).href; } catch (e) {}
    return peer.ask('fetch', {
      url: abs,
      method: init.method || 'GET',
      headers: init.headers || null,
      body: typeof init.body === 'string' ? init.body : null
    }, { timeout: opts.timeout ? opts.timeout + 5000 : 300000 }).then(r => new WireResponse(r));
  },

  async direct(url, init, opts) {
    let ctl = null, timer = 0;
    init = Object.assign({}, init);
    if (opts.timeout && !init.signal) {
      ctl = new AbortController();
      init.signal = ctl.signal;
      timer = setTimeout(() => ctl.abort(), opts.timeout);
    }
    try {
      return await fetch(url, init);
    } catch (e) {
      const err = new Error(e && e.name === 'AbortError' ? 'Nothing answered in time.' : 'The request never left this page.');
      err.wire = 'direct';
      throw err;
    } finally { if (timer) clearTimeout(timer); }
  }
};

/* True when a way out of the frame is actually carrying traffic. */
function wireHelped() { return Link.relayReady() || Link.hostAllowed(); }

const FRAME_BLOCKED_NOTE =
  'This page is running inside an iframe, and the page around it decides what a frame may contact. ' +
  'Open Engines \u2192 Connection and start the relay window: the relay is a page in its own right, ' +
  'so it can reach what this frame cannot.';

function wireFailNote(url, err) {
  let host = String(url || '');
  try { host = new URL(url, location.href).host || host; } catch (e) {}
  const parts = ['Could not reach ' + host + '.'];
  if (Frame.embedded && !wireHelped()) parts.push(FRAME_BLOCKED_NOTE);
  else if (err && /answered in time/i.test(err.message)) parts.push('Nothing answered in time.');
  else parts.push('Check the address, the key and your connection.');
  return parts.join(' ');
}

/* ==========================================================================
   THE RELAY WINDOW

   The same file, opened at #ai-relay. It draws a small status card instead of
   the chamber, answers its opener's requests, and closes when it is no longer
   wanted. Because it is top level it has its own CSP and its own origin, which
   is the entire point.
   ========================================================================== */
const Relay = {
  serving: false,
  served: 0,
  log: [],

  wanted() { return (location.hash || '').replace(/^#/, '').split(/[&?]/)[0] === RELAY_HASH; },

  start() {
    this.serving = true;
    document.title = 'AI Council \u2014 relay';
    this.paint();
    if (!window.opener) return;
    try { window.opener.postMessage({ ch: WIRE, v: WIRE_V, type: 'here', role: 'relay' }, '*'); } catch (e) {}
    window.addEventListener('beforeunload', () => {
      try { window.opener.postMessage({ ch: WIRE, v: WIRE_V, type: 'bye', role: 'relay' }, '*'); } catch (e) {}
    });
    /* If the chamber goes, there is nothing left to relay for. */
    setInterval(() => { try { if (!window.opener || window.opener.closed) window.close(); } catch (e) {} }, 3000);
  },

  handle(e) {
    const d = e.data;
    if (window.opener && e.source !== window.opener) return;   // only the page that opened us
    if (d.type === 'hello') {
      try { e.source.postMessage({ ch: WIRE, v: WIRE_V, type: 'here', role: 'relay' }, '*'); } catch (err) {}
      return;
    }
    if (d.type === 'bye') { window.close(); return; }
    if (d.type !== 'ask') return;
    if (d.op === 'fetch') this.doFetch(e.source, d);
    else if (d.op === 'webllm') this.doWebLLM(e.source, d);
    else this.fail(e.source, d, 'The relay does not know how to do that.');
  },

  reply(src, d, result, transfer) {
    try { src.postMessage({ ch: WIRE, v: WIRE_V, type: 'told', id: d.id, result }, '*', transfer || []); } catch (e) {}
  },
  fail(src, d, message) {
    try { src.postMessage({ ch: WIRE, v: WIRE_V, type: 'told', id: d.id, error: message }, '*'); } catch (e) {}
  },

  async doFetch(src, d) {
    const started = Date.now();
    let where = d.url;
    try { where = new URL(d.url).host; } catch (e) {}
    try {
      const res = await fetch(d.url, {
        method: d.method || 'GET',
        headers: d.headers || undefined,
        body: d.body == null ? undefined : d.body
      });
      const buf = await res.arrayBuffer();
      this.note(where, res.ok, res.status, Date.now() - started);
      this.reply(src, d, {
        ok: res.ok, status: res.status, statusText: res.statusText, url: res.url,
        type: res.headers.get('content-type') || '', buf
      }, [buf]);
    } catch (err) {
      this.note(where, false, 'blocked', Date.now() - started);
      this.fail(src, d, 'The relay could not reach ' + where + '. ' + relayReason(d.url));
    }
  },

  /* WebLLM downloads a library and a model. A host page's CSP can forbid the
     import outright, so the relay runs the model and posts the text back. */
  async doWebLLM(src, d) {
    const started = Date.now();
    try {
      let out;
      if (d.what === 'models') {
        out = await WebLLM.listModels();
      } else {
        const opts = Object.assign({}, d.opts || {}, {
          onStatus: (text, progress) => {
            try { src.postMessage({ ch: WIRE, v: WIRE_V, type: 'status', id: d.id, text, progress }, '*'); } catch (e) {}
          }
        });
        out = await WebLLM.chat(d.messages, d.model, opts);
      }
      this.note('in-browser model', true, 'ok', Date.now() - started);
      this.reply(src, d, out);
    } catch (err) {
      this.note('in-browser model', false, 'failed', Date.now() - started);
      this.fail(src, d, err.message);
    }
  },

  note(where, ok, code, ms) {
    this.served++;
    this.log.unshift({ at: Date.now(), where, ok, code, ms });
    if (this.log.length > 40) this.log.length = 40;
    this.paintLog();
  },

  paint() {
    const opener = !!window.opener;
    document.body.innerHTML =
      '<div class="relay-wrap">' +
        '<div class="eyebrow" style="letter-spacing:.24em">AI Council</div>' +
        '<h1 style="font-family:var(--serif);font-size:26px;color:#F0E7CF;margin:6px 0 4px;font-weight:400">The relay</h1>' +
        (opener
          ? '<p class="relay-lede">Leave this window open. The chamber is in a frame that cannot reach your own machine, ' +
            'so it asks this window to make its requests instead. Nothing is stored here and nothing is sent anywhere ' +
            'the chamber would not have sent it itself.</p>' +
            '<div class="keystat" style="margin:14px 0 12px"><span class="dot on"></span>' +
              '<span class="vstat ok" id="relayState">Standing by.</span></div>' +
            '<div class="eyebrow dim" style="margin-bottom:6px">Requests</div>' +
            '<div class="wire-log" id="relayLog"><span style="color:rgba(230,213,187,.38)">Nothing yet.</span></div>' +
            '<p class="hint" style="margin-top:14px">If a request below says <b>blocked</b>, the fault is on this side: ' +
            'Ollama is not running, or it was not started with <code>OLLAMA_ORIGINS=*</code>. If Chrome asks to allow ' +
            'access to devices on your network, say yes.</p>'
          : '<p class="relay-lede">This window was opened on its own, so there is nothing for it to relay. ' +
            'Close it and open the chamber instead.</p>') +
      '</div>';
  },

  paintLog() {
    const el = document.getElementById('relayLog');
    if (!el) return;
    const st = document.getElementById('relayState');
    if (st) st.textContent = this.served === 1 ? '1 request carried.' : this.served + ' requests carried.';
    el.innerHTML = this.log.map(r =>
      '<div><b>' + nowTime(r.at) + '</b> ' + esc(r.where) +
      ' <span class="' + (r.ok ? 'ok' : 'bad') + '">' + esc(String(r.code)) + '</span>' +
      ' <span style="color:rgba(230,213,187,.32)">' + r.ms + 'ms</span></div>'
    ).join('');
  }
};

/* Said by the relay when its own fetch failed — at that point the frame is no
   longer the suspect, so the advice is about Ollama and the browser. */
function relayReason(url) {
  let space = 'public';
  try { space = addressSpace(new URL(url).hostname); } catch (e) {}
  if (space === 'public') return 'The provider did not answer.';
  return 'Check Ollama is running and was started with OLLAMA_ORIGINS=*, and that Chrome has been allowed local network access for this page.';
}

/* ---------------------------------------------------------- the two snippets */
function bridgeSnippet() {
  return '<script>\n' +
'/* AI Council \u2014 network bridge. Paste into the page that embeds the app. */\n' +
'(function () {\n' +

function embedSnippet() {

/* ==========================================================================
   THE KEY VAULT — one set of API keys, shared across the offline tools.

   Every tool in this house reads and writes the same two localStorage
   entries, so a key typed once is available in all of them:

     dv.apiKeys       {"openai":"sk-…","anthropic":"sk-ant-…","google":"AIza…"}
     dv.apiKeys.meta  {"openai":{"status":"valid","at":1723459200000,"app":"AI Council"}}

   The first entry is deliberately a flat map of plain strings: any other
   single-file tool can read it in one line and needs to know nothing about
   this one. The meta entry is advisory — losing it costs a re-check, nothing
   more. Browsers pool local storage for file:// pages, so this works with no
   server, no install and no network.
   ========================================================================== */
const VAULT = 'dv.apiKeys';
const VAULT_META = 'dv.apiKeys.meta';
const VAULT_APP = 'AI Council';
const VAULT_ENGINES = ['openai', 'anthropic', 'google'];

function keyTail(k) { const s = String(k || '').trim(); return s ? s.slice(-6) : ''; }

const Vault = {
  read() {
    const raw = LS.get(VAULT, null);
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    /* Tolerate the richer shape some tools write: {keys:{openai:{key:'…'}}} */
    const src = (raw.keys && typeof raw.keys === 'object') ? raw.keys : raw;
    Object.keys(src).forEach(k => {
      const v = src[k];
      const s = typeof v === 'string' ? v : (v && typeof v.key === 'string' ? v.key : '');
      if (s && s.trim()) out[k] = s.trim();
    });
    return out;
  },
  meta() { const m = LS.get(VAULT_META, {}); return (m && typeof m === 'object') ? m : {}; },

  /* Copy this app's keys out to the shared entry. Only ever adds or updates —
     a key another tool saved is never deleted here, only by forget(). */
  push() {
    if (!State.shareKeys) return;
    const bag = this.read(), meta = this.meta(), now = Date.now();
    let touched = false;
    VAULT_ENGINES.forEach(k => {
      const mine = (State.keys[k] || '').trim();
      if (!mine || bag[k] === mine) return;
      bag[k] = mine;
      meta[k] = { status: (State.keyStatus[k] || {}).state || 'unknown', at: now, app: VAULT_APP };
      touched = true;
    });
    if (touched) { LS.set(VAULT, bag); LS.set(VAULT_META, meta); }
  },

  /* Adopt anything the shared entry has that this app does not. On a clash the
     newer of the two wins, which is what makes "type it once" work in either
     direction. Returns the engines it took. */
  pull() {
    const bag = this.read(), meta = this.meta();
    const mineAt = LS.get('council.keysAt', 0);
    const took = [];
    VAULT_ENGINES.forEach(k => {
      const shared = bag[k];
      if (!shared) return;
      const mine = (State.keys[k] || '').trim();
      if (mine === shared) return;
      const sharedAt = (meta[k] && meta[k].at) || 0;
      if (!mine || sharedAt > mineAt) { State.keys[k] = shared; took.push(k); }
    });
    if (took.length) LS.set('council.keys', State.keys);
    return took;
  },

  forget(engine, evenIfNotSharing) {
    if (!State.shareKeys && !evenIfNotSharing) return;
    const bag = this.read(), meta = this.meta();
    delete bag[engine]; delete meta[engine];
    LS.set(VAULT, bag); LS.set(VAULT_META, meta);
  },

  mark(engine, status) {
    if (!State.shareKeys) return;
    const meta = this.meta();
    meta[engine] = { status, at: Date.now(), app: VAULT_APP };
    LS.set(VAULT_META, meta);
  },

  /* Who else is holding keys in this browser, for the line in Engines. */
  summary() {
    const bag = this.read();
    return VAULT_ENGINES.filter(k => bag[k]);
  }
};

/* ==========================================================================
   KEY CHECKING — ask each provider whether the saved key is real.

   Three outcomes, and the difference matters. "invalid" means the provider
   looked at the key and refused it, and only that gets a key deleted.
   "unreachable" means we never got an answer — offline, blocked, a provider
   outage — and a key is always kept in that case. Deleting a good key because
   the wifi dropped would be the worse failure by a distance.
   ========================================================================== */
const KEY_SHAPE = {
  openai: /^sk-[A-Za-z0-9_\-]{16,}$/,
  anthropic: /^sk-ant-[A-Za-z0-9_\-]{16,}$/,
  google: /^AIza[A-Za-z0-9_\-]{20,}$/
};

async function probeKey(engine, key) {
  key = String(key || '').trim();
  if (!key) return { state: 'invalid', detail: 'No key saved.' };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  let res;
  try {
    if (engine === 'openai') {
      res = await Net.fetch('https://api.openai.com/v1/models', {
        headers: { Authorization: 'Bearer ' + key }, signal: ctl.signal
      }, { timeout: 12000 });
    } else if (engine === 'anthropic') {
      res = await Net.fetch('https://api.anthropic.com/v1/models?limit=1', {
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        }, signal: ctl.signal
      }, { timeout: 12000 });
    } else if (engine === 'google') {
      res = await Net.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', {
        headers: { 'x-goog-api-key': key }, signal: ctl.signal
      }, { timeout: 12000 });
    } else {
      return { state: 'unreachable', detail: 'This engine has no key to check.' };
    }
  } catch (e) {
    clearTimeout(timer);
    /* A malformed key that we also cannot test is still only a suspicion. */
    const shape = KEY_SHAPE[engine];
    if (shape && !shape.test(key)) {
      return { state: 'unreachable', detail: 'Could not reach the provider, and this does not look like a ' + ENGINES[engine].label + ' key.' };
    }
    return { state: 'unreachable', detail: e && e.name === 'AbortError' ? 'The provider did not answer within 12 seconds.' : 'Could not reach the provider from this page.' };
  }
  clearTimeout(timer);
  if (res.ok) return { state: 'valid', detail: 'Accepted.' };
  const msg = await readErr(res);
  if (res.status === 401 || res.status === 403) return { state: 'invalid', detail: msg || ('Rejected (HTTP ' + res.status + ').') };
  if (res.status === 400 && /api[ _-]?key|credential|unauthor|invalid/i.test(msg)) return { state: 'invalid', detail: msg };
  if (res.status === 429) return { state: 'valid', detail: 'Accepted — rate limited at the moment.' };
  return { state: 'unreachable', detail: 'HTTP ' + res.status + ' — ' + msg };
}

/* Check the given engines (default: every hosted engine holding a key) and,
   unless told otherwise, delete the ones the provider refused. */
async function verifyKeys(opts) {
  opts = opts || {};
  const prune = opts.prune !== false;
  const list = (opts.engines || VAULT_ENGINES).filter(k => ENGINES[k] && ENGINES[k].needsKey && hasKey(k));
  if (!list.length) return [];
  const results = await Promise.all(list.map(async k => {
    const r = await probeKey(k, State.keys[k]);
    return { engine: k, state: r.state, detail: r.detail, tail: keyTail(State.keys[k]) };
  }));
  const now = Date.now();
  results.forEach(r => {
    State.keyStatus[r.engine] = { state: r.state, detail: r.detail, tail: r.tail, at: now };
    if (r.state === 'invalid' && prune) {
      delete State.keys[r.engine];
      delete State.modelCache[r.engine];
      Vault.forget(r.engine, true);
      r.removed = true;
    } else if (r.state === 'valid') {
      Vault.mark(r.engine, 'valid');
    }
  });
  LS.set('council.keys', State.keys);
  LS.set('council.keyStatus', State.keyStatus);
  saveCache();
  markEnginesReady();
  return results;
}

/* Run once on load: adopt whatever the vault holds, then test what we have. */
async function startupKeyCheck() {
  const took = Vault.pull();
  if (took.length) {
    took.forEach(k => { delete State.keyStatus[k]; delete State.modelCache[k]; });
    saveCache();
    markEnginesReady();
    toast('Picked up a ' + took.map(k => ENGINES[k].label).join(' and ') + ' key saved by another tool.', 'good');
  }
  Vault.push();
  const held = VAULT_ENGINES.filter(hasKey);
  if (!held.length) return;
  /* A key verified in the last half hour is taken on trust, so a reload does
     not fire three requests at three providers for nothing. */
  const due = held.filter(k => {
    const s = State.keyStatus[k];
    return !(s && s.state === 'valid' && s.tail === keyTail(State.keys[k]) && (Date.now() - s.at) < 30 * 60 * 1000);
  });
  if (!due.length) { markEnginesReady(); return; }
  if (navigator.onLine === false) {
    toast('Offline, so the saved keys were left untouched.');
    return;
  }
  const res = await verifyKeys({ engines: due, prune: true });
  const label = k => ENGINES[k].label;
  const gone = res.filter(r => r.removed).map(r => label(r.engine));
  const ok = res.filter(r => r.state === 'valid').map(r => label(r.engine));
  const out = res.filter(r => r.state === 'unreachable').map(r => label(r.engine));
  if (gone.length) toast(gone.join(' and ') + ' refused the saved key, so it has been removed. Add a new one under Engines.', 'bad');
  if (ok.length) toast(ok.join(', ') + (ok.length === 1 ? ' key checked and accepted.' : ' keys checked and accepted.'), 'good');
  if (out.length && !ok.length && !gone.length) toast('Could not reach ' + out.join(' or ') + ' — those keys were kept as they are.');
  return res;
}

/* Another tool in another tab saved a key: take it without a reload. */
window.addEventListener('storage', e => {
  if (e.key !== VAULT) return;
  const took = Vault.pull();
  if (!took.length) return;
  took.forEach(k => { delete State.keyStatus[k]; delete State.modelCache[k]; });
  LS.set('council.keyStatus', State.keyStatus);
  saveCache(); markEnginesReady();
  toast('Picked up a ' + took.map(k => ENGINES[k].label).join(' and ') + ' key from another tool.', 'good');
  verifyKeys({ engines: took }).then(() => {
    took.forEach(k => { if (hasKey(k)) fetchModels(k, true).catch(() => {}); });
  });
});

/* Rough recency ranking so the newest models float to the top of a live list. */
function modelRank(engine, id) {
  const s = id.toLowerCase();
  let r = 0;
  const m = s.match(/(\d+(?:\.\d+)?)/);
  if (m) r += parseFloat(m[1]) * 100;
  if (engine === 'openai') {
    if (/sol/.test(s)) r += 60; else if (/terra/.test(s)) r += 40; else if (/luna/.test(s)) r += 20;
    if (/mini|nano/.test(s)) r -= 30;
    if (/audio|realtime|transcribe|tts|image|embed|moderation|search|codex/.test(s)) r -= 10000;
  }
  if (engine === 'anthropic') {
    if (/fable|mythos/.test(s)) r += 900;
    if (/opus/.test(s)) r += 500; else if (/sonnet/.test(s)) r += 300; else if (/haiku/.test(s)) r += 100;
  }
  if (engine === 'google') {
    if (/pro/.test(s)) r += 60; else if (/flash/.test(s)) r += 40;
    if (/lite/.test(s)) r -= 15;
    if (/image|embed|veo|tts|native-audio|live|aqa|learnlm/.test(s)) r -= 10000;
  }
  return r;
}

const ROMAN = ['I','II','III','IV','V'];
function shortModel(id) {
  return String(id || '').split(/[:/]/)[0].replace(/-(latest|preview|instruct)$/i, '').replace(/-\d{8}$/, '');

/* Two seats on the same provider must not both be called "Ollama" — the brief
   would read "You are Ollama, sitting with Ollama". Disambiguate by model,
   then by ordinal if even that matches. */
function nameOf(m) {
  if (!m) return 'Member';
  if (m.persona && m.persona.name) return m.persona.name;
  if (m.name && m.name.trim()) return m.name.trim();
  const base = (ENGINES[m.engine] && ENGINES[m.engine].label) || 'Member';
  const sibs = State.members.filter(x => !x.persona && !(x.name && x.name.trim()) && x.engine === m.engine);
  if (sibs.length < 2) return base;
  const short = shortModel(m.model);
  const same = sibs.filter(x => shortModel(x.model) === short);
  if (same.length < 2) return base + ' \u00b7 ' + short;
  const i = same.findIndex(x => x.id === m.id);
  return base + ' \u00b7 ' + short + ' ' + ROMAN[i % ROMAN.length];
}
