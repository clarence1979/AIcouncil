/* ==========================================================================
   ENGINE ADAPTERS
   Every adapter takes the same shape: listModels() and chat().
   Messages arrive as [{role:'system'|'user'|'assistant', content}].
   ========================================================================== */

/* Providers differ on whether they tolerate two messages in a row from the
   same role. Anthropic and Gemini do not, and this app produces them
   constantly, so collapse them everywhere. */
function collapseRoles(msgs) {
  const out = [];
  for (const m of msgs) {
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content;
    else out.push({ role: m.role, content: m.content });
  }
  return out;
}
function splitSystem(msgs) {
  const sys = msgs.filter(m => m.role === 'system').map(m => m.content).join('\n\n');
  const rest = collapseRoles(msgs.filter(m => m.role !== 'system'));
  while (rest.length && rest[0].role !== 'user') rest.shift();
  return { sys, rest };
}

/* ==========================================================================
   WHY A LOCAL REQUEST FAILED

   "Failed to fetch" covers three unrelated problems and each has its own fix,
   so the app works out which one it is before it says anything.

   Chrome 142 (October 2025) shipped Local Network Access: a page served from
   the public web may not reach localhost or a private address until the user
   grants a permission, and a denied permission looks exactly like a server
   that is not running. Ollama's own CORS rule sits on top of that, so a page
   hosted on a domain has two gates to get through and a page opened from the
   machine itself has none.
   ========================================================================== */
function addressSpace(host) {
  host = String(host || '').replace(/^\[|\]$/g, '').toLowerCase();
  if (host === 'localhost' || /(^|\.)localhost$/.test(host) || host === '::1' || /^127\./.test(host)) return 'loopback';
  if (/^10\./.test(host) || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host) ||
      /^169\.254\./.test(host) || /\.local$/.test(host) || /^f[cd][0-9a-f]{2}:/.test(host) || /^fe80:/.test(host)) return 'local';
  return 'public';
}
/* A file:// page and a page on localhost are both "here on this machine". */
function pageSpace() {
  if (location.protocol === 'file:') return 'loopback';
  return addressSpace(location.hostname);
}
/* True when the browser, not the server, is the thing standing in the way. */
function crossesIntoLocalNetwork(url) {
  let target;
  try { target = addressSpace(new URL(url, location.href).hostname); } catch { return false; }
  return target !== 'public' && pageSpace() === 'public';
}
function localFetchNote(url) {
  const parts = [];
  const framed = Frame.embedded && !wireHelped();
  if (framed) parts.push(FRAME_BLOCKED_NOTE);
  /* Inside a frame the permission paragraph is true but beside the point: the
     frame has to be dealt with first. The Engines sheet still prints both. */
  if (!framed && crossesIntoLocalNetwork(url)) {
    parts.push('This page is served from ' + location.origin + ', and Chrome 142 and later will not let a page from the web reach ' +
      'your own machine until you allow it \u2014 open the site menu at the left of the address bar and set Local network access ' +
      '(newer builds call it Apps on device) to Allow.');
  }
  parts.push('Ollama itself has to be running, and started with OLLAMA_ORIGINS=* so it will answer a page it did not serve.');
  return parts.join(' ');
}
/* The same reasoning, in markup, for the Engines sheet. Each cause gets its
   own paragraph, because in a frame there are usually two of them at once. */
function localFetchAdvice(url) {
  const bits = [];
  if (Frame.embedded && !wireHelped()) {
    bits.push('<b>This page is inside a frame.</b> The page around it decides what a frame may contact, and a frame cannot ' +
      'give itself permission to reach your own machine. The relay window can, and opening it changes nothing else.' +
      '<br><button class="btn sm" data-openwire style="margin:8px 0 0">Open Connection</button>');
  }
  if (crossesIntoLocalNetwork(url)) {
    bits.push('<b>Chrome may be blocking this, not Ollama.</b> This page is served from <code>' + esc(location.origin) + '</code>, ' +
      'and since Chrome 142 a page from the web cannot reach localhost or a private address until you allow it. ' +
      'Open the site menu at the left of the address bar, find <b>Local network access</b> ' +
      '(newer builds call it <b>Apps on device</b>) and set it to <b>Allow</b>, then reload.' +
      (lnaState ? ' Chrome currently reports this permission as <b>' + esc(lnaState) + '</b>.' : ''));
  }
  bits.push('<b>Ollama has to accept this page as well.</b> Start it with <code>OLLAMA_ORIGINS=* ollama serve</code>, ' +
    'or set that variable in the Ollama app settings. Check it is up with <code>curl ' +
    esc(String(url || '').replace(/\/+$/, '')) + '/api/tags</code>.');
  return bits.join('<br><br>');
}

async function readErr(res) {
  let t = '';
  try { t = await res.text(); } catch {}
  try { const j = JSON.parse(t); t = (j.error && (j.error.message || j.error)) || j.message || t; } catch {}
  return (t || res.statusText || ('HTTP ' + res.status)).slice(0, 400);
}

/* ---------------------------------------------------------------- Ollama */
const OllamaEngine = {
  base() { return (State.ollamaUrl || 'http://localhost:11434').replace(/\/+$/, ''); },
  /* fetch() rejects with a bare TypeError whether Ollama is down, blocked by
     CORS or blocked by the browser before it left the page. Say which. */
  async call(path, init, opts) {
    try {
      return await Net.fetch(this.base() + path, init, opts);
    } catch (e) {
      throw new Error('Could not reach Ollama at ' + this.base() + '. ' + localFetchNote(this.base()));
    }
  },
  async listModels() {
    const res = await this.call('/api/tags', null, { timeout: 15000 });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.models || []).map(m => ({
      id: m.name,
      note: m.details && m.details.parameter_size ? m.details.parameter_size : ''
    }));
  },
  async chat(messages, model, opts) {
    const res = await this.call('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model, messages: collapseRoles(messages), stream: false,
        options: { temperature: opts.temperature, num_predict: opts.maxTokens }
      })
    });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.message && data.message.content) || '';
  }
};

/* ---------------------------------------------------------------- WebLLM */
const WebLLM = {
  lib: null, engines: {}, loading: {}, blocked: false,
  /* The library is an ES module pulled off the network, and the weights follow
     it. A host page's script-src can refuse that import outright, and no
     amount of retrying inside the frame will change its mind. Once the import
     has failed here, the relay runs the model instead and posts the text back:
     the relay is a page of its own, with a policy of its own. */
  viaRelay() { return this.blocked && !Relay.serving && Frame.embedded && Link.relayReady(); },
  async load() {
    if (this.lib) return this.lib;
    if (!('gpu' in navigator)) {
      throw new Error('This browser has no WebGPU. Chrome or Edge 121+, or Safari 26+, can run in-browser models.' +
        (Frame.embedded ? ' A frame can also be refused WebGPU by the page around it.' : ''));
    }
    try {
      this.lib = await import('https://esm.run/@mlc-ai/web-llm');
    } catch (e) {
      this.blocked = true;
      throw new Error('Could not load the WebLLM library. It needs internet access the first time' +
        (Frame.embedded ? ', and the page around this frame may be refusing the download. Open Engines \u2192 Connection and start the relay window, which loads it in a page of its own' : '') +
        '. (' + e.message + ')');
    }
    return this.lib;
  },
  async listModels() {
    if (this.viaRelay()) return await Link.relay.ask('webllm', { what: 'models' }, { timeout: 90000 });
    let lib;
    try { lib = await this.load(); }
    catch (e) {
      if (this.viaRelay()) return await Link.relay.ask('webllm', { what: 'models' }, { timeout: 90000 });
      throw e;
    }
    const list = (lib.prebuiltAppConfig && lib.prebuiltAppConfig.model_list) || [];
    return list
      .filter(m => !/embedding|Coder|Base-/i.test(m.model_id))
      .map(m => ({
        id: m.model_id,
        note: m.vram_required_MB ? Math.round(m.vram_required_MB / 1024 * 10) / 10 + ' GB VRAM' : '',
        _rank: (/Qwen3|Llama-3\.2|Phi-4|Hermes-3|Ministral/i.test(m.model_id) ? 100 : 0) - (m.vram_required_MB || 0) / 4000
      }))
      .sort((a, b) => b._rank - a._rank);
  },
  async engineFor(model, onProgress) {
    if (this.engines[model]) return this.engines[model];
    if (this.loading[model]) return this.loading[model];
    const lib = await this.load();
    this.loading[model] = (async () => {
      const eng = await lib.CreateMLCEngine(model, {
        initProgressCallback: r => { if (onProgress) onProgress(r); }
      });
      this.engines[model] = eng;
      delete this.loading[model];
      return eng;
    })();
    return this.loading[model];
  },
  relayChat(messages, model, opts) {
    return Link.relay.ask('webllm', {
      what: 'chat', messages: collapseRoles(messages), model,
      opts: { temperature: opts.temperature, maxTokens: opts.maxTokens }
    }, { timeout: 15 * 60 * 1000, onStatus: opts.onStatus });
  },
  async chat(messages, model, opts) {
    if (this.viaRelay()) return await this.relayChat(messages, model, opts);
    try { await this.load(); }
    catch (e) {
      if (this.viaRelay()) return await this.relayChat(messages, model, opts);
      throw e;
    }
    const eng = await this.engineFor(model, r => {
      if (opts.onStatus) opts.onStatus(r.text || '', r.progress || 0);
    });
    const reply = await eng.chat.completions.create({
      messages: collapseRoles(messages),
      temperature: opts.temperature,
      max_tokens: opts.maxTokens,
      stream: false
    });
    return reply.choices[0].message.content || '';
  }
};

/* ---------------------------------------------------------------- OpenAI */
const OpenAIEngine = {
  key() { return (State.keys.openai || '').trim(); },
  async listModels() {
    const res = await Net.fetch('https://api.openai.com/v1/models', {
      headers: { Authorization: 'Bearer ' + this.key() }
    }, { timeout: 25000 });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.data || []).map(m => ({ id: m.id }));
  },
  async chat(messages, model, opts) {
    // Newer models renamed max_tokens and fix temperature; retry rather than guess.
    let body = {
      model, messages: collapseRoles(messages),
      temperature: opts.temperature,
      max_completion_tokens: opts.maxTokens
    };
    for (let attempt = 0; attempt < 4; attempt++) {
      const res = await Net.fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.key() },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        const data = await res.json();
        return (data.choices && data.choices[0] && data.choices[0].message.content) || '';
      }
      const err = await readErr(res);
      if (/max_completion_tokens/i.test(err) && 'max_completion_tokens' in body) {
        body = Object.assign({}, body); body.max_tokens = body.max_completion_tokens; delete body.max_completion_tokens; continue;
      }
      if (/max_tokens/i.test(err) && 'max_tokens' in body) {
        body = Object.assign({}, body); body.max_completion_tokens = body.max_tokens; delete body.max_tokens; continue;
      }
      if (/temperature/i.test(err) && 'temperature' in body) {
        body = Object.assign({}, body); delete body.temperature; continue;
      }
      throw new Error(err);
    }
    throw new Error('OpenAI rejected the request four times running.');
  },
  async speak(text, voice, model, speed) {
    const res = await Net.fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.key() },
      body: JSON.stringify({ model: model || 'gpt-4o-mini-tts', input: text, voice: voice || 'alloy', speed: clamp(speed || 1, 0.25, 4) })
    });
    if (!res.ok) throw new Error(await readErr(res));
    return await res.blob();
  },
  async image(prompt, model) {
    const res = await Net.fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.key() },
      body: JSON.stringify({ model: model || 'gpt-image-2', prompt, n: 1, size: '1024x1024' })
    });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    const d = data.data[0];
    return d.b64_json ? 'data:image/png;base64,' + d.b64_json : d.url;
  }
};

/* ------------------------------------------------------------- Anthropic */
const AnthropicEngine = {
  key() { return (State.keys.anthropic || '').trim(); },
  headers() {
    return {
      'Content-Type': 'application/json',
      'x-api-key': this.key(),
      'anthropic-version': '2023-06-01',
      // Anthropic blocks browser calls unless you opt in explicitly.
      'anthropic-dangerous-direct-browser-access': 'true'
    };
  },
  async listModels() {
    const res = await Net.fetch('https://api.anthropic.com/v1/models?limit=100', { headers: this.headers() }, { timeout: 25000 });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.data || []).map(m => ({ id: m.id, note: m.display_name || '' }));
  },
  async chat(messages, model, opts) {
    const { sys, rest } = splitSystem(messages);
    const res = await Net.fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: this.headers(),
      body: JSON.stringify({
        model, system: sys || undefined, messages: rest,
        max_tokens: opts.maxTokens, temperature: clamp(opts.temperature, 0, 1)
      })
    });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  }
};

/* ---------------------------------------------------------------- Google */
const GoogleEngine = {
  key() { return (State.keys.google || '').trim(); },
  async listModels() {
    const res = await Net.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {
      headers: { 'x-goog-api-key': this.key() }
    }, { timeout: 25000 });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    return (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => ({ id: m.name.replace(/^models\//, ''), note: m.displayName || '' }));
  },
  async chat(messages, model, opts) {
    const { sys, rest } = splitSystem(messages);
    const body = {
      contents: rest.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { temperature: opts.temperature, maxOutputTokens: opts.maxTokens }
    };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    if (opts.json) body.generationConfig.responseMimeType = 'application/json';
    const res = await Net.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': this.key() },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await readErr(res));
    const data = await res.json();
    const cand = data.candidates && data.candidates[0];
    if (!cand) throw new Error('No reply returned' + (data.promptFeedback ? ' (' + JSON.stringify(data.promptFeedback).slice(0, 160) + ')' : ''));
    return ((cand.content && cand.content.parts) || []).map(p => p.text || '').join('').trim();
  }
};

const ADAPTERS = { ollama: OllamaEngine, webllm: WebLLM, openai: OpenAIEngine, anthropic: AnthropicEngine, google: GoogleEngine };

async function askEngine(engine, messages, model, opts) {
  const a = ADAPTERS[engine];
  if (!a) throw new Error('Unknown engine: ' + engine);
  if (ENGINES[engine].needsKey && !hasKey(engine)) throw new Error('No ' + ENGINES[engine].label + ' key saved. Open Engines to add one.');
  return await a.chat(messages, model, opts || {});
}

/* ---- model lists, live where possible, cached, curated as a fallback ---- */
async function fetchModels(engine, force) {
  const cached = State.modelCache[engine];
  const fresh = cached && (Date.now() - cached.at < 1000 * 60 * 60 * 12);
  if (cached && fresh && !force) return cached.list;
  try {
    let list = await ADAPTERS[engine].listModels();
    if (engine !== 'ollama' && engine !== 'webllm') {
      const known = new Set(list.map(m => m.id));
      (FALLBACK_MODELS[engine] || []).forEach(f => { if (!known.has(f.id)) list.push(f); });
      list = list.filter(m => modelRank(engine, m.id) > -1000);
      list.sort((a, b) => modelRank(engine, b.id) - modelRank(engine, a.id));
      const notes = {}; (FALLBACK_MODELS[engine] || []).forEach(f => { if (f.note) notes[f.id] = f.note; });
      list.forEach(m => { if (notes[m.id]) m.note = notes[m.id]; });
    }
    State.modelCache[engine] = { at: Date.now(), list, live: true };
    saveCache();
    return list;
  } catch (e) {
    if (cached) return cached.list;
    const fb = FALLBACK_MODELS[engine];
    if (fb) { State.modelCache[engine] = { at: Date.now(), list: fb, live: false }; saveCache(); return fb; }
    throw e;
  }
}
function cachedModels(engine) {
  const c = State.modelCache[engine];
  if (c && c.list && c.list.length) return c.list;
  return FALLBACK_MODELS[engine] || [];
}
function defaultModelFor(engine) {
  const l = cachedModels(engine);
  return l.length ? l[0].id : '';
}

/* ==========================================================================
   VOICE — browser speech by default, OpenAI TTS when a key exists.
   ========================================================================== */
const OPENAI_VOICES = ['alloy','ash','ballad','coral','echo','fable','nova','onyx','sage','shimmer','verse'];
const Voice = {
  audio: null, sysVoices: [],
  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => { this.sysVoices = speechSynthesis.getVoices() || []; };
    load();
    speechSynthesis.onvoiceschanged = load;
  },
  browserVoiceList() { return this.sysVoices; },
  pickBrowserVoice(member) {
    if (!this.sysVoices.length) return null;
    if (member.voice && member.voice.browserURI) {
      const v = this.sysVoices.find(v => v.voiceURI === member.voice.browserURI);
      if (v) return v;
    }
    const en = this.sysVoices.filter(v => /^en/i.test(v.lang));
    const pool = en.length ? en : this.sysVoices;
    const idx = State.members.findIndex(m => m.id === member.id);
    return pool[(idx < 0 ? 0 : idx) % pool.length];
  },
  clean(t) {
    return String(t).replace(/\*\*/g, '').replace(/[*_`#>]/g, '')
      .replace(/\[[^\]]*\]/g, '').replace(/\n{2,}/g, '. ').replace(/\n/g, ' ').trim();
  },
  stop() {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch {}
    if (this.audio) { try { this.audio.pause(); } catch {} this.audio = null; }
  },
  async speak(text, member) {
    const clean = this.clean(text);
    if (!clean) return;
    const useOpenAI = State.orders.ttsEngine === 'openai' && hasKey('openai');
    if (useOpenAI) {
      try { return await this.speakOpenAI(clean, member); }
      catch (e) { toast('OpenAI speech failed: ' + e.message + ' — falling back to the browser voice.', 'bad'); }
    }
    return await this.speakBrowser(clean, member);
  },
  speakOpenAI(text, member) {
    const vid = (member.voice && member.voice.openai) || 'alloy';
    const rate = (member.voice && member.voice.rate) || 1;
    return OpenAIEngine.speak(text, vid, State.orders.ttsModel, rate).then(blob => new Promise((resolve) => {
      this.stop();
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      this.audio = a;
      const done = () => { URL.revokeObjectURL(url); if (this.audio === a) this.audio = null; resolve(); };
      a.onended = done; a.onerror = done;
      a.play().catch(done);
    }));
  },
  speakBrowser(text, member) {
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) return resolve();
      this.stop();
      const u = new SpeechSynthesisUtterance(text.slice(0, 4000));
      const v = this.pickBrowserVoice(member);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = clamp((member.voice && member.voice.rate) || 1, 0.5, 2);
      u.pitch = clamp((member.voice && member.voice.pitch) || 1, 0, 2);
      let settled = false;
      const done = () => { if (!settled) { settled = true; resolve(); } };
      u.onend = done; u.onerror = done;
      // Some browsers silently drop long utterances; do not hang the sitting.
      setTimeout(done, Math.min(60000, 900 + text.length * 75));
      speechSynthesis.speak(u);
    });
  }
};

/* ==========================================================================
   THE BRIEF — the system prompt handed to a member before they speak.
   Exposed in the UI on purpose: seeing the brief is how you learn what a
   system prompt actually does.
   ========================================================================== */
const TEMPER = {
  collegial: {
    label: 'Collegial', desc: 'Disagree, but courteously. Safe for any classroom.',
    line: 'Disagree where you genuinely disagree, and say so plainly, but stay courteous. Concede a point when the other member has earned it.'
  },
  robust: {
    label: 'Robust', desc: 'Direct, unhedged, willing to be blunt.',
    line: 'Push back hard. Do not hedge and do not open with agreement out of politeness. If the reasoning is weak, name the weakness in the first sentence. Be direct; stop short of contempt.'
  },
  ruthless: {
    label: 'Ruthless', desc: 'The original setting. Sharp elbows.',
    line: 'Assume the previous speaker is wrong until they prove otherwise. Go straight at the weakest link in their argument. Blunt, informal, no diplomatic softening. Attack the idea, never the member.'
  }
};
const STYLE = {
  debate:      { label: 'Debate',           desc: 'Argue opposing sides of the motion',
                 line: 'This is a formal debate on the motion. Take a clear side and defend it. Answer the argument the previous speaker actually made, not a weaker version of it.' },
  discussion:  { label: 'Discussion',       desc: 'Explore the question together',
                 line: 'This is an exploratory discussion. Add something the previous speaker missed rather than restating them. Move the question forward each turn.' },
  consensus:   { label: 'Consensus',        desc: 'Test the idea, then try to land somewhere',
                 line: 'The council is working toward a position. Test the previous speaker properly first, then say what you could actually agree to and on what condition.' },
  crossexam:   { label: 'Cross-examination', desc: 'Interrogate the previous speaker',
                 line: 'Cross-examine the previous speaker. Put a pointed question to them that their argument cannot comfortably answer, and say why it cannot.' }
};
const BREVITY = {
  terse: { label: 'Terse',  sentences: 'ONE sentence. Not two.',                 tokens: 120 },
  short: { label: 'Short',  sentences: 'Two or three sentences at most.',        tokens: 260 },
  full:  { label: 'Full',   sentences: 'A short paragraph — five sentences at the very most.', tokens: 600 }
};

function buildBrief(member) {
  const me = nameOf(member);
  const others = seated().filter(m => m.id !== member.id).map(nameOf);
  const o = State.orders;
  const brevity = BREVITY[o.brevity] || BREVITY.short;
  const L = [];

  L.push('You are ' + me + ', a member of a council' + (others.length ? ' sitting with ' + others.join(', ') : '') + '.');
  L.push('');
  L.push('THE MOTION BEFORE THE COUNCIL: ' + (State.motion || '(not yet stated)'));
  L.push('');

  if (member.persona) {
    const p = member.persona;
    L.push('CHARACTER — you are ' + p.name + (p.era ? ' (' + p.era + ')' : '') + '.');
    if (p.desc) L.push(p.desc);
    if (p.traits && p.traits.length) L.push('Traits: ' + p.traits.join(', ') + '.');
    if (p.style) L.push('How you speak: ' + p.style);
    if (p.phrasing && p.phrasing.length) L.push('Habits of phrasing: ' + p.phrasing.join('; ') + '.');
    L.push('Be this person. Do not describe them from the outside and do not break character to explain yourself.');
  } else {
    const t = TEMPERAMENTS.find(t => t.id === member.temperament) || TEMPERAMENTS[0];
    L.push('TEMPERAMENT — ' + t.label + '. ' + t.brief);
  }
  L.push('');
  L.push('HOW THE COUNCIL SITS: ' + (STYLE[o.style] || STYLE.debate).line);
  L.push((TEMPER[o.temper] || TEMPER.robust).line);
  L.push('');
  L.push('STANDING ORDERS:');
  L.push('- ' + brevity.sentences + ' Length is a rule, not a suggestion.');
  L.push('- Speak only as ' + me + '. Never write another member\u2019s turn for them.');
  L.push('- Never open with your own name or a label like "' + me + ':". Just speak.');
  L.push('- Address what was actually just said. Quote a word or two of it if it helps.');
  L.push('- No stage directions, no asterisks, no narration of your own gestures.');
  L.push('- If the chair interjects, answer the chair first.');
  if (member.note) { L.push(''); L.push('A NOTE FROM THE CHAIR, FOR YOU ALONE: ' + member.note); }
  return L.join('\n');
}

function buildContext(member) {
  const msgs = [{ role: 'system', content: buildBrief(member) }];
  for (const e of State.record) {
    if (e.kind === 'chair') { msgs.push({ role: 'user', content: 'THE CHAIR: ' + e.text }); continue; }
    if (e.kind !== 'speech' || e.error) continue;
    if (e.memberId === member.id) msgs.push({ role: 'assistant', content: e.text });
    else msgs.push({ role: 'user', content: nameOf(memberById(e.memberId)) + ': ' + e.text });
  }
  if (!msgs.some(m => m.role !== 'system')) {
    msgs.push({ role: 'user', content: 'The motion is: ' + State.motion + '\n\nYou have been called first. Open the debate.' });
  }
  return msgs;
}

/* ==========================================================================
   WHO SPEAKS NEXT
   ========================================================================== */
const CALL_MODES = {
  sequential:  { label: 'In order',    desc: 'Around the bench, left to right' },
  random:      { label: 'By ballot',   desc: 'Drawn at random, never twice running' },
  responsive:  { label: 'Responsive',  desc: 'Whoever the last speech most invites' },
  chair:       { label: 'Chair calls', desc: 'You choose each speaker yourself' }
};

function lastSpeech() {
  for (let i = State.record.length - 1; i >= 0; i--) if (State.record[i].kind === 'speech') return State.record[i];
  return null;
}
function chooseSpeaker(forcedId) {
  const pool = seated();
  if (!pool.length) return null;
  if (forcedId) return pool.find(m => m.id === forcedId) || null;
  const last = lastSpeech();
  const mode = State.orders.callMode;

  if (mode === 'sequential' || pool.length === 1) {
    if (!last) return pool[0];
    const i = pool.findIndex(m => m.id === last.memberId);
    return pool[i < 0 ? 0 : (i + 1) % pool.length];
  }
  const eligible = last ? pool.filter(m => m.id !== last.memberId) : pool;
  const field = eligible.length ? eligible : pool;
  if (mode === 'random') return field[Math.floor(Math.random() * field.length)];

  if (mode === 'responsive') {
    const text = (last ? last.text : State.motion || '').toLowerCase();
    const CUES = {
      analytical:   ['data','evidence','figure','number','study','measure','proof','statistic'],
      creative:     ['imagine','design','invent','new','possible','create','story','art'],
      sarcastic:    ['obviously','of course','clearly','genius','naturally','sure'],
      enthusiastic: ['exciting','opportunity','brilliant','great','love','future','can'],
      skeptical:    ['claim','assume','trust','believe','probably','likely','apparently'],
      philosophical:['meaning','ought','right','wrong','truth','purpose','ethics','justice','human'],
      pragmatic:    ['cost','budget','work','practical','implement','staff','time','actually'],
      witty:        ['funny','absurd','ridiculous','joke','irony','silly']
    };
    let best = null, bestScore = -1;
    for (const m of field) {
      let s = Math.random() * 2;
      const nm = nameOf(m).toLowerCase();
      if (nm && text.includes(nm.split(' ')[0])) s += 12;
      if (m.persona) {
        if (text.includes(m.persona.name.toLowerCase())) s += 8;
        (m.persona.traits || []).forEach(t => { if (text.includes(String(t).toLowerCase())) s += 2.5; });
      }
      (CUES[m.temperament] || []).forEach(k => { if (text.includes(k)) s += 2; });
      if (text.includes('?')) s += 0.6;
      if (s > bestScore) { bestScore = s; best = m; }
    }
    return best || field[0];
  }
  return field[0];
}

/* ==========================================================================
   THE SITTING — the turn loop
   ========================================================================== */
function targetResponses() {
  const r = State.orders.rounds;
  return r > 0 ? r * Math.max(1, seated().length) : 0;
}

async function runTurn(forcedId) {
  if (!State.sitting || State.paused || State.abort) return;
  const member = chooseSpeaker(forcedId);
  if (!member) { adjourn('No members are seated.'); return; }

  State.speaking = member.id;
  State.awaitingChair = false;
  renderBench(); renderControls();
  const thinkingEl = showThinking(member);

  let text = '', failed = false;
  try {
    const brief = buildContext(member);
    const brevity = BREVITY[State.orders.brevity] || BREVITY.short;
    text = await askEngine(member.engine, brief, member.model, {
      temperature: typeof member.temperature === 'number' ? member.temperature : 0.8,
      maxTokens: brevity.tokens,
      onStatus: (msg, p) => updateThinking(thinkingEl, msg, p)
    });
    text = (text || '').trim().replace(new RegExp('^' + nameOf(member).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '');
    if (!text) { text = 'The member declines to speak — the engine returned nothing.'; failed = true; }
  } catch (e) {
    text = e.message || String(e);
    failed = true;
  }
  thinkingEl.remove();
  if (State.abort) { State.speaking = null; renderBench(); return; }

  State.seq += 1;
  const entry = {
    id: uid(), kind: 'speech', memberId: member.id, text, error: failed,
    n: State.seq, at: Date.now(), model: member.model, engine: member.engine,
    brief: buildBrief(member)
  };
  State.record.push(entry);
  appendEntry(entry);
  State.speaking = null;
  State.responses += 1;
  State.round = Math.floor((State.responses - 1) / Math.max(1, seated().length)) + 1;
  renderBench(); renderControls(); autosave();

  if (!failed && State.orders.speakAloud) { try { await Voice.speak(text, member); } catch {} }
  else await sleep(failed ? 1400 : 600);

  if (!State.sitting || State.paused || State.abort) { renderControls(); return; }
  const target = targetResponses();
  if (target && State.responses >= target) { adjourn('The council has completed ' + State.orders.rounds + ' round' + (State.orders.rounds === 1 ? '' : 's') + '.'); return; }

  if (State.orders.callMode === 'chair') { State.awaitingChair = true; renderFloor(); return; }
  runTurn();
}

function convene(motion) {
  const pool = seated();
  if (pool.length < MIN_MEMBERS) {
    toast('Seat at least ' + MIN_MEMBERS + ' members \u2014 a council of one is not a debate.', 'bad');
    openSeatPicker(); return false;
  }
  const missing = pool.filter(m => !engineReady(m.engine));
  if (missing.length) { toast('These seats have no key: ' + missing.map(nameOf).join(', '), 'bad'); openEngines(); return false; }
  if (!pool.every(m => m.model)) { toast('One or more seats has no model selected.', 'bad'); return false; }

  Voice.stop();
  State.motion = motion;
  State.record = [{ id: uid(), kind: 'motion', text: motion, at: Date.now() }];
  State.sitting = true; State.paused = false; State.abort = false;
  State.responses = 0; State.round = 1; State.seq = 0; State.awaitingChair = false;
  renderFloor(); renderControls(); renderBench(); autosave();
  if (State.orders.callMode === 'chair') { State.awaitingChair = true; renderFloor(); return true; }
  setTimeout(() => runTurn(), 320);
  return true;
}

function interject(text) {
  State.seq += 1;
  const entry = { id: uid(), kind: 'chair', text, at: Date.now(), n: State.seq };
  State.record.push(entry);
  appendEntry(entry); autosave();
  if (State.paused) { State.paused = false; renderControls(); setTimeout(() => runTurn(), 260); }
  return true;
}

function pauseSitting() { State.paused = true; Voice.stop(); renderControls(); }
function resumeSitting() {
  if (!State.sitting) return;
  State.paused = false; State.abort = false; renderControls();
  if (State.orders.callMode === 'chair') { State.awaitingChair = true; renderFloor(); return; }
  setTimeout(() => runTurn(), 220);
}
function adjourn(why) {
  State.sitting = false; State.paused = false; State.abort = true;
  State.speaking = null; State.awaitingChair = false;
  Voice.stop(); renderBench(); renderControls(); renderFloor(); autosave();
  if (why) toast(why);
}
function clearRecord() {
  State.record = []; State.motion = ''; State.responses = 0; State.round = 0; State.seq = 0;
  State.sitting = false; State.paused = false; State.abort = true; State.speaking = null; State.awaitingChair = false;
  Voice.stop(); LS.del('council.session');
  renderFloor(); renderControls(); renderBench();
}
function autosave() {
  LS.set('council.session', { motion: State.motion, record: State.record, seq: State.seq, at: Date.now() });
}
function restoreSession() {
  const s = LS.get('council.session', null);
  if (!s || !s.record || !s.record.length) return false;
  State.motion = s.motion || ''; State.record = s.record; State.seq = s.seq || s.record.length;
  State.responses = s.record.filter(e => e.kind === 'speech').length;
  State.round = Math.floor(Math.max(0, State.responses - 1) / Math.max(1, seated().length)) + 1;
  return true;
}

/* ==========================================================================
   RENDER — the bench
   ========================================================================== */
function renderBench() {
  const wrap = $('#seats'), pool = seated();
  $('#benchCount').textContent = pool.length + ' of 5 seated';
  wrap.innerHTML = '';
  pool.forEach(m => {
    const onFloor = State.speaking === m.id;
    const el = document.createElement('div');
    el.className = 'seat' + (onFloor ? ' floor' : '') + (State.speaking && !onFloor ? ' muted' : '');
    const portrait = m.portrait ? '<img src="' + esc(m.portrait) + '" alt="">' : esc(m.persona ? m.persona.glyph : (m.glyph || '🏛️'));
    const tag = m.persona
      ? '<span class="seat-tag persona" title="Character">' + esc(m.persona.name) + '</span>'
      : '<span class="seat-tag" title="Temperament">' + esc((TEMPERAMENTS.find(t => t.id === m.temperament) || TEMPERAMENTS[0]).label) + '</span>';
    el.innerHTML =
      '<div class="seat-glyph" style="background:' + esc(m.colour || '#3A3B2C') + '33;border-color:' + esc(m.colour || '#000') + '66">' + portrait + '</div>' +
      '<div class="seat-body">' +
        '<div class="seat-line">' +
          '<button class="seat-name" data-act="cfg" data-id="' + m.id + '" title="Configure this seat">' + esc(nameOf(m)) + '</button>' +
          (onFloor ? '<span class="floor-tag">Floor</span>' : '') +
          '<button class="seat-x" data-act="rm" data-id="' + m.id + '" title="Vacate the seat" aria-label="Vacate seat">' + ICON.x + '</button>' +
        '</div>' +
        '<div class="seat-line sub">' +
          '<span style="color:' + esc(ENGINES[m.engine].accent) + ';line-height:0;flex:none">' + (MARK[m.engine] || '') + '</span>' +
          '<button class="seat-model" data-act="cfg" data-id="' + m.id + '" title="' + esc(m.engine + ' \u00b7 ' + m.model) + '">' + esc(m.model || 'no model') + '</button>' +
          tag +
          '<button class="seat-cfg" data-act="cfg" data-id="' + m.id + '">Edit</button>' +
        '</div>' +
      '</div>';
    wrap.appendChild(el);
  });
  if (pool.length < 5) {
    const add = document.createElement('button');
    add.className = 'seat add';
    add.innerHTML = '<span class="ring">+</span><span class="lbl">Seat a member</span>';
    add.onclick = openSeatPicker;
    wrap.appendChild(add);
    // the remaining places stay visible so the bench always reads as five
    for (let i = pool.length + 1; i < 5; i++) {
      const v = document.createElement('button');
      v.className = 'seat vacant';
      v.setAttribute('aria-label', 'Empty seat — seat a member');
      v.innerHTML = ICON.bust + '<span class="lbl">Empty seat</span>';
      v.onclick = openSeatPicker;
      wrap.appendChild(v);
    }
  }
  wrap.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'cfg') openSeatConfig(b.dataset.id);
    if (b.dataset.act === 'rm') {
      const m = memberById(b.dataset.id); if (!m) return;
      State.members = State.members.filter(x => x.id !== m.id);
      saveMembers(); renderBench(); renderControls(); if (!State.record.length) renderFloor();
      toast(nameOf(m) + ' has left the chamber.');
    }
  };
  const box = $('#motionBox');
  const enough = State.sitting || pool.length >= MIN_MEMBERS;
  $('#btnPut').disabled = !enough || !box.value.trim();
  refreshChair();
}

/* ==========================================================================
   RENDER — chamber controls
   ========================================================================== */
function renderControls() {
  const el = $('#controls');
  const live = State.sitting;
  const hasRecord = State.record.some(e => e.kind === 'speech');
  if (!live && !hasRecord) { el.className = 'controls hidden'; el.innerHTML = ''; return; }
  el.className = 'controls';
  const bits = [];
  if (live) {
    bits.push(State.paused
      ? '<button class="cbtn go" data-act="resume">' + ICON.play + 'Resume</button>'
      : '<button class="cbtn" data-act="pause">' + ICON.pause + 'Pause</button>');
    bits.push('<button class="cbtn stop" data-act="adjourn">' + ICON.stop + 'Adjourn</button>');
  }
  if (hasRecord) {
    bits.push('<button class="cbtn" data-act="hansard">' + ICON.doc + 'Hansard</button>');
    bits.push('<button class="cbtn" data-act="division">' + ICON.gavel + 'Division</button>');
    if (!live) bits.push('<button class="cbtn" data-act="clear">' + ICON.trash + 'Clear</button>');
  }
  const target = targetResponses();
  const pill = live
    ? '<span class="turnpill"><span class="sitting-dot"></span>' +
      (State.paused ? 'Paused · ' : '') + 'Round ' + State.round + (State.orders.rounds > 0 ? ' of ' + State.orders.rounds : '') +
      ' · speech ' + State.responses + (target ? '/' + target : '') + '</span>'
    : '<span class="turnpill">Adjourned · ' + State.responses + ' speech' + (State.responses === 1 ? '' : 'es') + '</span>';
  el.innerHTML = bits.join('') + pill;
  el.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'pause') pauseSitting();
    if (a === 'resume') resumeSitting();
    if (a === 'adjourn') adjourn('Sitting adjourned.');
    if (a === 'hansard') openHansard();
    if (a === 'division') openDivision();
    if (a === 'clear') confirmDialog('Clear the record?', 'The transcript of this sitting will be discarded. This cannot be undone.', 'Clear', clearRecord);
  };
}

/* ==========================================================================
   RENDER — the floor / Hansard record
   ========================================================================== */
function renderFloor() {
  const inner = $('#floorInner');
  if (!State.record.length) { inner.innerHTML = emptyChamber(); wireEmpty(); return; }
  const motion = State.record.find(e => e.kind === 'motion');
  inner.innerHTML =
    '<div class="record">' +
      '<div class="record-head">' +
        '<b>Hansard</b><span>Official record of the sitting</span>' +
        '<span class="rh-r">' + new Date(motion ? motion.at : Date.now()).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) + '</span>' +
      '</div>' +
      '<div class="record-body" id="recordBody"></div>' +
      '<div id="callSlot"></div>' +
    '</div>';

  State.record.forEach(e => body.appendChild(entryNode(e)));
  renderCallSlot();
  scrollFloor();
}

function renderCallSlot() {
  const slot = $('#callSlot'); if (!slot) return;
  if (!State.awaitingChair || !State.sitting) { slot.innerHTML = ''; return; }
  const pool = seated();
  slot.innerHTML =
    '<div class="callto"><div class="lbl">The chair calls upon\u2026</div><div class="opts">' +
    pool.map(m =>
      '<button data-call="' + m.id + '">' +
        '<span style="font-size:16px">' + (m.portrait ? '<img src="' + esc(m.portrait) + '" style="width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle">' : esc(m.persona ? m.persona.glyph : (m.glyph || '🏛️'))) + '</span>' +
        '<span class="cn">' + esc(nameOf(m)) + '</span>' +
      '</button>').join('') +
    '</div></div>';
  slot.onclick = ev => {
    const b = ev.target.closest('[data-call]'); if (!b) return;

function entryNode(e) {
  const div = document.createElement('div');
  if (e.kind === 'motion') {
    div.className = 'motion';
    div.innerHTML = '<div class="lbl">The motion</div><p>' + esc(e.text) + '</p><div class="who">Put by the chair · ' + nowTime(e.at) + '</div>';
    return div;
  }
  if (e.kind === 'chair') {
    div.className = 'entry chair';
    div.innerHTML =
      '<div class="gutter"><span class="n">' + (e.n || '') + '</span><span class="t">' + nowTime(e.at) + '</span></div>' +
      '<div class="said"><div class="said-head"><span class="said-name">The Chair</span>' +
      '<span class="said-role">interjection</span></div>' +
      '<p class="said-text">' + esc(e.text) + '</p></div>';
    return div;
  }
  const m = memberById(e.memberId);
  div.className = 'entry';
  div.dataset.entry = e.id;
  const tools = [
    '<button class="tool" data-t="speak">' + ICON.speak + 'Read aloud</button>',
    '<button class="tool" data-t="copy">' + ICON.copy + 'Copy</button>'
  ];
  if (State.orders.showBriefs && e.brief) tools.push('<button class="tool" data-t="brief">' + ICON.eye + 'View brief</button>');
  div.innerHTML =
    '<div class="gutter"><span class="n">' + (e.n || '') + '</span><span class="t">' + nowTime(e.at) + '</span></div>' +
    '<div class="said">' +
      (m && m.portrait ? '<img class="said-portrait" src="' + esc(m.portrait) + '" alt="">' : '') +
      '<div class="said-head">' +
        '<span class="said-swatch" style="background:' + esc((m && m.colour) || '#888') + '"></span>' +
        '<span class="said-name">' + esc(m ? nameOf(m) : 'Former member') + '</span>' +
        '<span class="said-model">' + esc(e.model || '') + '</span>' +
        (e.error ? '<span class="said-role">engine error</span>' : '') +
      '</div>' +
      '<p class="said-text' + (e.error ? ' err' : '') + '">' + esc(e.text) + '</p>' +
      '<div class="said-tools">' + tools.join('') + '</div>' +
    '</div>';
  div.querySelector('.said-tools').onclick = ev => {
    const b = ev.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.t === 'copy') {
      navigator.clipboard.writeText(e.text).then(() => toast('Copied.'), () => toast('Clipboard blocked by the browser.', 'bad'));
    }
    if (b.dataset.t === 'brief') openBrief(e);
    if (b.dataset.t === 'speak') {
      if (b.classList.contains('on')) { Voice.stop(); b.classList.remove('on'); b.innerHTML = ICON.speak + 'Read aloud'; return; }
      $$('.tool.on').forEach(x => { x.classList.remove('on'); x.innerHTML = ICON.speak + 'Read aloud'; });
      b.classList.add('on'); b.innerHTML = ICON.mute + 'Stop';
      Voice.speak(e.text, m || { id: 'x' }).finally(() => { b.classList.remove('on'); b.innerHTML = ICON.speak + 'Read aloud'; });
    }
  };
  return div;
}

function appendEntry(e) {
  const body = $('#recordBody');
  if (!body) { renderFloor(); return; }
  body.appendChild(entryNode(e));

}

function showThinking(member) {

function updateThinking(el, msg, p) {

function scrollFloor() {

function emptyChamber() {

  const rows = STARTER_MOTIONS.slice(0, 6).map((m, i) =>

function wireEmpty() {

/* ==========================================================================
   MODAL FRAMEWORK
   ========================================================================== */
let modalStack = [];
function openModal(opts) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="sheet' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="sheet-head"><h3>' + esc(opts.title) + '</h3><button class="x" aria-label="Close">' + ICON.x + '</button></div>' +
      (opts.tabs ? '<div class="tabs">' + opts.tabs.map((t, i) => '<button data-tab="' + i + '"' + (i === (opts.tab || 0) ? ' class="on"' : '') + '>' + esc(t) + '</button>').join('') + '</div>' : '') +
      '<div class="sheet-body"></div>' +
      (opts.foot ? '<div class="sheet-foot">' + opts.foot + '</div>' : '') +
    '</div>';
  $('#modalRoot').appendChild(scrim);
  modalStack.push(scrim);
  const close = () => {
    scrim.remove();
    modalStack = modalStack.filter(s => s !== scrim);
    if (opts.onClose) opts.onClose();
  };
  scrim.querySelector('.x').onclick = close;
  scrim.onmousedown = e => { if (e.target === scrim) close(); };
  const api = { el: scrim, body: scrim.querySelector('.sheet-body'), foot: scrim.querySelector('.sheet-foot'), close };
  if (opts.tabs) {
    scrim.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      scrim.querySelectorAll('[data-tab]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      opts.onTab(+b.dataset.tab, api);
    });
  }
  if (opts.render) opts.render(api);
  return api;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) {
    const top = modalStack[modalStack.length - 1];
    top.querySelector('.x').click();
  }
});
function confirmDialog(title, msg, label, onYes) {
  const m = openModal({
    title,
    foot: '<button class="btn" data-no>Cancel</button><button class="btn danger" data-yes>' + esc(label) + '</button>',
    render: a => { a.body.innerHTML = '<p style="margin:0;font-size:14px;line-height:1.6;color:rgba(220,214,199,.75)">' + esc(msg) + '</p>'; }
  });
  m.foot.querySelector('[data-no]').onclick = m.close;
  m.foot.querySelector('[data-yes]').onclick = () => { m.close(); onYes(); };
}

    return '<div class="wire-card">' +
      '<h4>The page around this one</h4>' +
      '<div class="keystat"><span class="dot' + (allowed ? ' on' : found ? ' warn' : '') + '"></span>' +
        '<span class="vstat' + (allowed ? ' ok' : found ? ' warn' : '') + '">' + esc(
          allowed ? 'Allowed, and making requests on this page\u2019s behalf.'
                  : found ? 'It offers to make requests for this page. Not allowed yet.'
                          : 'It is not offering. Paste the bridge below into it to change that.') + '</span></div>' +
      (found && !allowed
        ? '<div class="note warn" style="margin:9px 0 0"><b>Read this before allowing it.</b> Every request would be handed to ' +
          '<code>' + esc(Link.hostKey()) + '</code> to make for you, API keys and all. Allow it only if that page is yours.</div>'
        : '<div class="hint" style="margin-top:7px">Quicker than the relay and needs no second window, but it hands your requests ' +
          '\u2014 keys included \u2014 to whoever wrote the embedding page.</div>') +
      '<div class="inline" style="gap:7px;margin-top:9px;flex-wrap:wrap">' +
        (found
          ? (allowed ? '<button class="btn sm danger" data-bridgeoff>Stop using it</button>'
                     : '<button class="btn sm" data-bridgeon>Allow ' + esc(Link.hostKey()) + '</button>')
          : '<button class="btn sm" data-bridgefind>Ask again</button>') +
      '</div>' +
    '</div>';
  };

  const routeCard = () => {
    const opts = [['auto', 'Choose for me'], ['direct', 'Direct only'], ['relay', 'Relay first'], ['bridge', 'Bridge first']];
    return '<div class="wire-card">' +
      '<h4>Which road to take</h4>' +
      '<div class="hint">Leave this on <b>Choose for me</b> unless you are testing something. It tries direct first, and the ' +
        'moment a request fails to leave the page it switches to whatever else is open.</div>' +
      '<div class="wire-pick">' + opts.map(o =>
        '<button data-route="' + o[0] + '"' + (Net.mode === o[0] ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>').join('') +
      '</div>' +
    '</div>';
  };

  const testCard = () =>
    '<div class="wire-card">' +
      '<h4>Test it</h4>' +
      '<div class="hint">Calls every engine you have set up and reports which road the answer came back on.</div>' +
      '<div class="inline" style="margin-top:9px"><button class="btn sm" data-test>Test every engine</button></div>' +
      (probe ? '<div class="wire-log" style="margin-top:9px">' + probe + '</div>' : '') +
    '</div>';

  const snippetCard = () =>
    '<div class="wire-card">' +
      '<h4>For whoever embeds this page</h4>' +
      '<div class="hint">A frame has to be handed permission to reach a local address, and every frame in the chain has to pass ' +
        'it on. This is the tag that does it. Adding <code>sandbox</code> takes the permission away again, so leave it off.</div>' +
      '<div class="snip"><pre>' + esc(embedSnippet()) + '</pre>' +
        '<button class="btn sm" data-copyembed>Copy the frame tag</button></div>' +
      '<div class="hint" style="margin-top:14px">And this, in that same page, is the bridge: it lets the page make requests for ' +
        'this one, with no second window. Nothing happens until you allow it above.</div>' +
      '<div class="snip"><pre>' + esc(bridgeSnippet()) + '</pre>' +
        '<button class="btn sm" data-copybridge>Copy the bridge</button></div>' +
    '</div>';

  const draw = () => {
    m.body.innerHTML =
      '<div class="note">Every engine call has to leave this page somehow. From a window of its own that is simply direct. ' +
      'From inside a frame it often cannot be, because the page around it decides what a frame may contact \u2014 so the app ' +
      'carries two ways round, and uses whichever is open.</div>' +
      whereCard() + relayCard() + bridgeCard() + routeCard() + testCard() + snippetCard();
    wireUp();
  };

  const wireUp = () => {
    const relayBtn = m.body.querySelector('[data-relay]');
    if (relayBtn && !relayBtn.disabled) relayBtn.onclick = async () => {
      relayBtn.disabled = true; relayBtn.textContent = 'Opening\u2026';
      const ok = await Link.openRelay();
      draw();
      toast(ok ? 'The relay is open. Leave that window where it is.'
               : 'The relay window could not be opened. Check that pop-ups are allowed here.', ok ? 'good' : 'bad');
      if (ok) refreshAfterConnect();
    };
    const off = m.body.querySelector('[data-relayoff]');
    if (off) off.onclick = () => { Link.closeRelay(); draw(); };

    const find = m.body.querySelector('[data-bridgefind]');
    if (find) find.onclick = async () => {
      find.disabled = true; find.textContent = 'Asking\u2026';
      const ok = await Link.findHost();
      draw();
      if (!ok) toast('The page around this one did not answer. It needs the bridge script below.');
    };
    const on = m.body.querySelector('[data-bridgeon]');
    if (on) on.onclick = () => {
      Link.allowHost(true); draw();
      toast('The embedding page will now make requests for this one.', 'good');
      refreshAfterConnect();
    };
    const bOff = m.body.querySelector('[data-bridgeoff]');
    if (bOff) bOff.onclick = () => { Link.allowHost(false); draw(); toast('Stopped. Requests go direct or through the relay.'); };

    m.body.querySelectorAll('[data-route]').forEach(b => b.onclick = () => { Net.setMode(b.dataset.route); draw(); });

    const test = m.body.querySelector('[data-test]');
    if (test) test.onclick = async () => {
      test.disabled = true; const old = test.textContent; test.textContent = 'Testing\u2026';
      probe = '<div style="color:rgba(230,213,187,.38)">Working\u2026</div>';
      const lines = await wireTest();
      probe = lines.join('');
      test.disabled = false; test.textContent = old;
      draw();
    };

    const ce = m.body.querySelector('[data-copyembed]');
    if (ce) ce.onclick = () => copyText(embedSnippet(), 'Frame tag');
    const cb = m.body.querySelector('[data-copybridge]');
    if (cb) cb.onclick = () => copyText(bridgeSnippet(), 'Bridge');

    m.foot.querySelector('[data-done]').onclick = m.close;
  };

  /* Redraw while the sheet is up; forget the sheet once it is gone, so a long
     session does not collect a watcher per visit. */
  Link.onChange(function watch() {
    if (document.body.contains(m.el)) draw();
    else Link.watchers = Link.watchers.filter(f => f !== watch);
  });
  draw();
}

/* A model list that failed before there was a way out is still empty. Now that
   there is one, go and get it, quietly. */
function refreshAfterConnect() {
  Net.directBadUntil = 0;
  fetchModels('ollama', true)
    .then(l => { if (l.length) { markEnginesReady(); renderBench(); toast(l.length + ' Ollama model(s) found.', 'good'); } })
    .catch(() => {});
  Object.keys(ENGINES).forEach(k => {
    if (ENGINES[k].needsKey && hasKey(k)) fetchModels(k, true).catch(() => {});
  });
}

/* One line per engine, saying whether it answered and by which road. */
async function wireTest() {
  const say = (label, ok, detail, via) =>
    '<div><b>' + esc(label) + '</b> <span class="' + (ok ? 'ok' : 'bad') + '">' + esc(ok ? 'answered' : 'no answer') + '</span>' +
    (via ? ' <span style="color:rgba(230,213,187,.42)">via ' + esc(via) + '</span>' : '') +
    '<br><span style="color:rgba(230,213,187,.5)">' + esc(detail) + '</span></div>';

  const out = [];
  const base = (State.ollamaUrl || 'http://localhost:11434').replace(/\/+$/, '');
  try {
    const res = await Net.fetch(base + '/api/tags', {}, { timeout: 10000 });
    const via = Net.last;
    if (res.ok) {
      const data = await res.json();
      out.push(say('Ollama', true, ((data.models || []).length) + ' model(s) at ' + base, via));
    } else {
      out.push(say('Ollama', false, 'HTTP ' + res.status + ' from ' + base, via));
    }
  } catch (e) { out.push(say('Ollama', false, e.message, '')); }

  for (const k of VAULT_ENGINES) {
    if (!hasKey(k)) continue;
    const r = await probeKey(k, State.keys[k]);
    out.push(say(ENGINES[k].label, r.state === 'valid', r.detail, r.state === 'valid' ? Net.last : ''));
  }
  if (out.length === 1) out.push('<div style="color:rgba(230,213,187,.42)">No hosted keys saved, so there was nothing else to try.</div>');
  return out;
}

/* ==========================================================================
   MODAL — Engines and keys
   ========================================================================== */
function openEngines() {
  const m = openModal({
    title: 'Engines', wide: true,
    foot: '<button class="btn primary" data-done>Done</button>',
    onClose: () => { renderBench(); }
  });
  const draw = () => {
    m.body.innerHTML =
      '<div class="note">Local engines need no key and no account. Hosted engines call the provider straight from this page, so your key stays in this browser\u2019s storage and is never sent anywhere else — but anyone with access to this browser profile can read it.</div>' +
      wireBar() +
      vaultBar() +
      ENGINE_ORDER.map(k => engineBlock(k)).join('');
    wire();
  };
  /* Where the requests are getting out, said in one line, with the sheet that
     explains it a click away. Framed pages get it first because it is usually
     the reason nothing works. */
  const wireBar = () => {
    return '<div class="vaultbar">' +
      '<span class="eyebrow" style="letter-spacing:.18em">Connection</span>' +
      '<span class="grow"><span class="dot ' + wireDot() + '" style="display:inline-block;margin-right:7px"></span>' +
        esc(wireStatusLine()) + '</span>' +
      '<button class="btn sm" data-openwire>Connection</button>' +
    '</div>';
  };
  const vaultBar = () => {
    const shared = Vault.summary();
    const line = shared.length
      ? 'Held for ' + shared.map(k => ENGINES[k].label).join(', ') + '. Every tool that reads this vault can use them, and they are checked against the provider each time this page opens.'
      : 'Nothing saved yet. A key you enter below is kept here too, so your other offline tools can use it without you typing it again.';
    return '<div class="vaultbar">' +
      '<span class="eyebrow" style="letter-spacing:.18em">Shared keys</span>' +
      '<span class="grow">' + esc(line) + '</span>' +
      '<label class="switchrow"><input type="checkbox" data-share' + (State.shareKeys ? ' checked' : '') + '>' +
        '<span>Share with my other tools</span></label>' +
      '<button class="btn sm" data-verifyall>Check every key</button>' +
    '</div>';
  };
  /* One line per hosted engine saying what the provider last said about the key. */
  const verdictLine = k => {
    if (!ENGINES[k].needsKey || !hasKey(k)) return '';
    const s = State.keyStatus[k];
    if (!s || s.tail !== keyTail(State.keys[k])) {
      return '<div class="keystat"><span class="dot"></span><span class="vstat">Not checked yet.</span></div>';
    }
    const when = ' Checked ' + new Date(s.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.';
    if (s.state === 'valid') return '<div class="keystat"><span class="dot on"></span><span class="vstat ok">' + esc(ENGINES[k].label + ' accepted this key.' + when) + '</span></div>';
    if (s.state === 'invalid') return '<div class="keystat"><span class="dot bad"></span><span class="vstat bad">' + esc('Rejected: ' + s.detail) + '</span></div>';
    return '<div class="keystat"><span class="dot warn"></span><span class="vstat warn">' + esc('Not confirmed: ' + s.detail) + '</span></div>';
  };
  const engineBlock = k => {
    const E = ENGINES[k], cache = State.modelCache[k];
    const count = cache && cache.list ? cache.list.length : 0;
    const live = cache && cache.live;
    let status = '<span class="dot"></span><span style="color:rgba(220,214,199,.5)">not set up</span>';
    if (!E.needsKey) status = '<span class="dot' + (count ? ' on' : '') + '"></span><span style="color:rgba(220,214,199,.6)">' + (count ? count + ' models found' : 'not checked yet') + '</span>';
    else if (hasKey(k)) status = '<span class="dot on"></span><span style="color:rgba(220,214,199,.6)">key saved' + (count ? ' · ' + count + ' models' + (live ? ' (live)' : ' (built-in list)') : '') + '</span>';
    return '<div style="border:1px solid rgba(201,162,77,.18);border-radius:3px;padding:12px 13px;margin-bottom:10px">' +
      '<div class="inline" style="margin-bottom:8px">' +
        '<span style="color:' + E.accent + ';line-height:0">' + (MARK[k] || '') + '</span>' +
        '<b style="font-size:14px;color:#F0E7CF;letter-spacing:.02em">' + esc(E.label) + '</b>' +
        '<span class="eyebrow dim" style="margin-left:auto">' + (E.kind === 'local' ? 'Local' : 'Hosted') + '</span>' +
      '</div>' +
      '<div class="hint" style="margin:0 0 9px">' + esc(E.blurb) + '</div>' +
      (k === 'ollama'
        ? '<div class="field" style="margin-bottom:8px"><label>Ollama address</label>' +
          '<input type="text" data-ourl value="' + esc(State.ollamaUrl) + '" placeholder="http://localhost:11434">' +
          '<div class="hint">Ollama refuses requests from other pages unless you allow this origin. Start it with <code>OLLAMA_ORIGINS=* ollama serve</code>, or set that variable in the Ollama app settings.</div>' +
          ((crossesIntoLocalNetwork(State.ollamaUrl) || (Frame.embedded && !wireHelped()))
            ? '<div class="note warn" style="margin:9px 0 0">' + localFetchAdvice(State.ollamaUrl) + '</div>'
            : '') +
          '</div>'
        : '') +
      (E.needsKey
        ? '<div class="field" style="margin-bottom:8px"><label>API key</label><div class="reveal">' +
          '<input type="password" data-key="' + k + '" value="' + esc(State.keys[k] || '') + '" placeholder="' + esc(E.keyHint) + '" autocomplete="off" spellcheck="false">' +
          '<button class="eye" data-reveal aria-label="Show key">' + ICON.eye + '</button></div>' +
          '<div class="hint">Get one at <code>' + esc(E.console) + '</code>. Saving fetches the current model list from the provider, so the choices stay up to date.</div>' +
          verdictLine(k) + '</div>'
        : '') +
      '<div class="inline" style="gap:7px;flex-wrap:wrap">' +
        '<button class="btn sm" data-check="' + k + '">' + (E.needsKey ? 'Save + fetch models' : 'Check + fetch models') + '</button>' +
        (E.needsKey && hasKey(k) ? '<button class="btn sm" data-verify="' + k + '">Check this key</button>' : '') +
        (E.needsKey && hasKey(k) ? '<button class="btn sm danger" data-forget="' + k + '">Forget key</button>' : '') +
        '<span class="keystat" style="margin-left:auto">' + status + '</span>' +
      '</div>' +
      '<div class="hint" data-out="' + k + '" style="margin-top:7px"></div>' +
    '</div>';
  };
  const wire = () => {
    m.body.querySelectorAll('[data-openwire]').forEach(b => b.onclick = () => openConnection());
    m.body.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => {
      const i = b.parentElement.querySelector('input');
      const show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      b.innerHTML = show ? ICON.eyeoff : ICON.eye;
    });
    const ourl = m.body.querySelector('[data-ourl]');
    if (ourl) ourl.onchange = () => { State.ollamaUrl = ourl.value.trim() || 'http://localhost:11434'; LS.set('council.ollamaUrl', State.ollamaUrl); };

    /* A key typed here reaches the shared vault the moment the field loses
       focus, so switching tools never means typing it again. */
    m.body.querySelectorAll('[data-key]').forEach(i => i.onchange = () => {
      const k = i.dataset.key, v = i.value.trim();
      if (v === (State.keys[k] || '').trim()) return;
      if (v) State.keys[k] = v; else delete State.keys[k];
      delete State.keyStatus[k]; saveKeyStatus();
      saveKeys(); markEnginesReady();
    });

    const share = m.body.querySelector('[data-share]');
    if (share) share.onchange = () => {
      State.shareKeys = share.checked;
      LS.set('council.shareKeys', State.shareKeys);
      if (State.shareKeys) { Vault.push(); toast('Keys saved here are now shared with your other tools.', 'good'); }
      else { VAULT_ENGINES.forEach(k => Vault.forget(k, true)); toast('Keys removed from the shared vault. This app keeps its own copy.'); }
      draw();
    };

    const all = m.body.querySelector('[data-verifyall]');
    if (all) all.onclick = async () => {
      const held = VAULT_ENGINES.filter(hasKey);
      if (!held.length) { toast('No hosted keys are saved yet.'); return; }
      all.disabled = true; const old = all.textContent; all.textContent = 'Checking\u2026';
      const res = await verifyKeys({ engines: held, prune: true });
      all.disabled = false; all.textContent = old;
      const gone = res.filter(r => r.removed).map(r => ENGINES[r.engine].label);
      const ok = res.filter(r => r.state === 'valid').map(r => ENGINES[r.engine].label);
      if (gone.length) toast(gone.join(' and ') + ' refused the key, so it has been removed.', 'bad');
      else if (ok.length === res.length) toast('Every saved key was accepted.', 'good');
      draw();
    };

    m.body.querySelectorAll('[data-verify]').forEach(b => b.onclick = async () => {
      const k = b.dataset.verify;
      const inp = m.body.querySelector('[data-key="' + k + '"]');
      if (inp && inp.value.trim() && inp.value.trim() !== (State.keys[k] || '').trim()) { State.keys[k] = inp.value.trim(); saveKeys(); }
      b.disabled = true; const old = b.textContent; b.textContent = 'Checking\u2026';
      const res = await verifyKeys({ engines: [k], prune: true });
      b.disabled = false; b.textContent = old;
      const r = res[0];
      if (!r) { toast('Nothing to check.'); }
      else if (r.removed) toast(ENGINES[k].label + ' refused the key, so it has been removed.', 'bad');
      else if (r.state === 'valid') toast(ENGINES[k].label + ' accepted the key.', 'good');
      else toast(ENGINES[k].label + ': ' + r.detail);
      draw();
    });

    m.body.querySelectorAll('[data-forget]').forEach(b => b.onclick = () => {
      const k = b.dataset.forget;
      delete State.keys[k]; saveKeys();
      delete State.keyStatus[k]; saveKeyStatus();
      delete State.modelCache[k]; saveCache();
      Vault.forget(k, true);
      markEnginesReady();
      toast(ENGINES[k].label + ' key removed from this app and the shared vault.');
      draw();
    });
    m.body.querySelectorAll('[data-check]').forEach(b => b.onclick = async () => {
      const k = b.dataset.check, out = m.body.querySelector('[data-out="' + k + '"]');
      const inp = m.body.querySelector('[data-key="' + k + '"]');
      if (inp) {
        const v = inp.value.trim();
        if (v) State.keys[k] = v; else delete State.keys[k];
        if ((State.keyStatus[k] || {}).tail !== keyTail(v)) { delete State.keyStatus[k]; saveKeyStatus(); }
        saveKeys();
      }
      if (ourl && k === 'ollama') { State.ollamaUrl = ourl.value.trim() || State.ollamaUrl; LS.set('council.ollamaUrl', State.ollamaUrl); }
      b.disabled = true; const old = b.textContent; b.textContent = 'Checking…';
      out.innerHTML = '';
      try {
        if (ENGINES[k].needsKey && hasKey(k)) {
          const [v] = await verifyKeys({ engines: [k], prune: true });
          if (v && v.removed) {
            out.innerHTML = '<span style="color:#E29A80">' + esc(ENGINES[k].label + ' refused that key, so it has not been kept: ' + v.detail) + '</span>';
            toast(ENGINES[k].label + ' refused that key.', 'bad');
            return;
          }
        }
        const list = await fetchModels(k, true);
        out.innerHTML = '<span style="color:#A9CDA3">Found ' + list.length + ' model' + (list.length === 1 ? '' : 's') +
          '. Newest first: ' + esc(list.slice(0, 3).map(x => x.id).join(', ')) + '</span>';
        toast(ENGINES[k].label + ': ' + list.length + ' models available.', 'good');
      } catch (err) {
        out.innerHTML = '<span style="color:#E29A80">' + esc(err.message) + '</span>' +
          (k === 'ollama' ? '<br>' + localFetchAdvice(State.ollamaUrl) : '');
      } finally { b.disabled = false; b.textContent = old; draw(); }
    });
  };
  draw();
  m.foot.querySelector('[data-done]').onclick = m.close;
}

}
function BREVITY_CHOICES() {
  const out = {};
  Object.keys(BREVITY).forEach(k => out[k] = { label: BREVITY[k].label, desc: BREVITY[k].sentences.replace(/ Length is.*/, '') });
  return out;
}

/* ==========================================================================
   MODAL — seat a new member
   ========================================================================== */
function openSeatPicker() {
  if (seated().length >= 5) { toast('The bench holds five.', 'bad'); return; }
  let engine = ENGINE_ORDER.find(engineReady) || 'ollama';
  let model = '';
  const m = openModal({
    title: 'Seat a member',
    foot: '<button class="btn" data-cancel>Cancel</button><button class="btn primary" data-add disabled>Seat them</button>'
  });
  const draw = async () => {
    m.body.innerHTML =
      '<div class="field"><label>Engine</label><div class="choices">' +
        ENGINE_ORDER.map(k => {
          const ready = engineReady(k);
          return '<button class="choice' + (engine === k ? ' on' : '') + '" data-eng="' + k + '"' + (ready ? '' : ' style="opacity:.45"') + '>' +
            '<b><span style="color:' + ENGINES[k].accent + ';display:inline-block;vertical-align:-2px;line-height:0;margin-right:5px">' + (MARK[k] || '') + '</span>' + esc(ENGINES[k].label) + '</b>' +
            '<small>' + (ready ? esc(ENGINES[k].kind === 'local' ? 'no key needed' : 'key saved') : 'needs a key') + '</small></button>';
        }).join('') + '</div></div>' +
      '<div class="field"><label>Model</label><select data-model><option>Loading…</option></select>' +
      '<div class="hint" data-mhint></div></div>';
    m.body.querySelectorAll('[data-eng]').forEach(b => b.onclick = () => {
      engine = b.dataset.eng; model = '';
      if (!engineReady(engine)) { toast('Add a ' + ENGINES[engine].label + ' key first.', 'bad'); openEngines(); return; }
      draw();
    });
    await fillModelSelect(m.body.querySelector('[data-model]'), m.body.querySelector('[data-mhint]'), engine, '', id => {
      model = id; m.foot.querySelector('[data-add]').disabled = !id;
    });
  };
  draw();
  m.foot.querySelector('[data-cancel]').onclick = m.close;
  m.foot.querySelector('[data-add]').onclick = () => {
    if (!model) return;
    const used = new Set(State.members.map(x => x.glyph));
    const member = {
      id: uid(), engine, model,
      name: '', colour: HOUSE_COLOURS[State.members.length % HOUSE_COLOURS.length],
      glyph: GLYPHS.find(g => !used.has(g)) || '🏛️',
      temperament: TEMPERAMENTS[State.members.length % TEMPERAMENTS.length].id,
      persona: null, portrait: '', note: '',
      temperature: 0.8, active: true,
      voice: { openai: OPENAI_VOICES[State.members.length % OPENAI_VOICES.length], rate: 1, pitch: 1, browserURI: '' }
    };
    State.members.push(member); saveMembers();
    m.close(); renderBench(); if (!State.record.length) renderFloor();
    toast(ENGINES[engine].label + ' seated on the bench.', 'good');
  };
}

/* fill a <select> with an engine's model list, live where possible */
async function fillModelSelect(sel, hintEl, engine, current, onPick) {
  sel.innerHTML = '<option>Loading…</option>'; sel.disabled = true;
  if (hintEl) hintEl.textContent = '';
  let list = [], err = null;
  try { list = await fetchModels(engine, false); }
  catch (e) { err = e; list = cachedModels(engine); }
  sel.disabled = false;
  if (!list.length) {
    sel.innerHTML = '<option value="">No models found</option>';
    if (hintEl) hintEl.innerHTML = '<span style="color:#E29A80">' + esc(err ? err.message : 'Nothing came back from ' + ENGINES[engine].label + '.') + '</span>';
    onPick('');
    return;
  }
  const chosen = current && list.some(x => x.id === current) ? current : list[0].id;
  sel.innerHTML = list.map(x =>
    '<option value="' + esc(x.id) + '"' + (x.id === chosen ? ' selected' : '') + '>' + esc(x.id) + (x.note ? '  —  ' + esc(x.note) : '') + '</option>'
  ).join('') + '<option value="__custom">Type a model id myself…</option>';
  const cache = State.modelCache[engine];
  if (hintEl) {
    hintEl.innerHTML = err
      ? '<span style="color:#E29A80">Could not reach ' + esc(ENGINES[engine].label) + ' (' + esc(err.message) + '). Showing the built-in list.</span>'
      : (cache && cache.live ? 'Live list from ' + esc(ENGINES[engine].label) + ', newest first.' : 'Built-in list — connect in Engines to refresh it.') +
        ' <button class="btn sm" data-refresh style="margin-left:6px">Refresh</button>';
    const rb = hintEl.querySelector('[data-refresh]');
    if (rb) rb.onclick = async () => { await fetchModels(engine, true); fillModelSelect(sel, hintEl, engine, sel.value, onPick); };
  }
  sel.onchange = () => {
    if (sel.value === '__custom') {
      const v = prompt('Model id to use with ' + ENGINES[engine].label + ':', chosen);
      if (v && v.trim()) {
        const opt = document.createElement('option');
        opt.value = v.trim(); opt.textContent = v.trim() + '  —  typed in';
        sel.insertBefore(opt, sel.firstChild); sel.value = v.trim();
      } else { sel.value = chosen; }
    }
    onPick(sel.value);
  };
  onPick(chosen);
}

/* ---- ask the seat's own engine to draft a character sheet ---- */
async function researchCharacter(who, notes, member) {
  const schema = '{"name":"","era":"","desc":"","traits":["","","","",""],"style":"","phrasing":["","",""]}';
  const sys = 'You write character sheets for a debating simulation. Reply with one JSON object and nothing else. ' +
    'No markdown fence, no commentary. Use this exact shape: ' + schema;
  const user =
    'Character: ' + who + '\n' +
    (notes ? 'The chair insists on this: ' + notes + '\n' : '') +
    '\nFill the fields:\n' +
    '- name: how they should appear on a nameplate\n' +
    '- era: dates or period, short\n' +
    '- desc: two sentences on who they are and what they care about\n' +
    '- traits: five short personality traits\n' +
    '- style: three sentences on how they construct a sentence, their register and vocabulary\n' +
    '- phrasing: three habits of phrasing, each written as "does X" (describe the habit, do not quote them)\n' +
    '\nReturn only the JSON object.';
  const raw = await askEngine(member.engine, [{ role: 'system', content: sys }, { role: 'user', content: user }], member.model,
    { temperature: 0.7, maxTokens: 900, json: true });
  const p = parseLooseJSON(raw);
  if (!p || !p.name) throw new Error('The engine did not return usable JSON. It said: ' + String(raw).slice(0, 180));
  return {
    id: 'custom-' + uid().slice(0, 8),
    name: String(p.name).slice(0, 60),
    era: String(p.era || '').slice(0, 40),
    group: 'Invented',
    glyph: '🎭',
    desc: String(p.desc || ''),
    traits: (Array.isArray(p.traits) ? p.traits : String(p.traits || '').split(',')).map(s => String(s).trim()).filter(Boolean).slice(0, 8),
    style: String(p.style || ''),
    phrasing: (Array.isArray(p.phrasing) ? p.phrasing : String(p.phrasing || '').split('\n')).map(s => String(s).trim()).filter(Boolean).slice(0, 6)
  };
}
function parseLooseJSON(s) {
  if (!s) return null;
  let t = String(s).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  return null;
}
/* keep portraits small enough to survive localStorage */
function shrinkImage(src, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      try { resolve(c.toDataURL('image/jpeg', 0.82)); } catch (e) { resolve(src); }
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

function download(name, text, mime) {
  const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

      '<div class="field"><label>Who should sum up?</label><select data-judge>' +
        pool.map(x => '<option value="' + x.id + '">' + esc(nameOf(x)) + ' — ' + esc(x.model) + '</option>').join('') +
      '</select></div>' +

    m.body.querySelector('[data-go]').onclick = async () => {
      const judge = memberById(m.body.querySelector('[data-judge]').value);
      const btn = m.body.querySelector('[data-go]'), out = m.body.querySelector('[data-out]');
      btn.disabled = true; btn.textContent = 'Reading the record…';
      out.innerHTML = '<div class="note">' + esc(nameOf(judge)) + ' is reading ' + State.record.filter(e => e.kind === 'speech').length + ' speeches…</div>';
      try {
        const res = await callDivision(judge);
        State.division = res; renderControls(); render();
      } catch (e) {
        out.innerHTML = '<div class="note bad">' + esc(e.message) + '</div>';
        btn.disabled = false; btn.textContent = 'Call the division';
      }
    };
  };
  render();
  m.foot.querySelector('[data-done]').onclick = m.close;
  m.foot.querySelector('[data-print]').onclick = () => { if (!State.division) { toast('Call the division first.', 'bad'); return; } printRecord(); };
}

async function callDivision(judge) {
  const transcript = State.record.filter(e => e.kind === 'speech' && !e.error).map(e => {
    const mm = memberById(e.memberId);
    return (mm ? nameOf(mm) : 'Former member') + ': ' + e.text;
  }).join('\n\n');
  const names = seated().map(nameOf).join(', ');
  const sys = 'You are the clerk of a council. You summarise debates accurately and then give a considered verdict. Follow the requested format exactly.';
  const user =
    'MOTION: ' + State.motion + '\n\nMEMBERS: ' + names + '\n\nTHE RECORD:\n' + transcript +
    '\n\nWrite two things and label them exactly as shown.\n\n' +
    'SUMMARY:\nThree short paragraphs. What each member argued, where the real disagreement sat, and what was left unresolved. Do not take a side here.\n\n' +
    'CARRIED BY:\nName the member who argued best and give two or three sentences of reasons — the quality of their reasoning, not the popularity of their position. If it was genuinely even, say so and explain why.';
  const raw = await askEngine(judge.engine, [{ role: 'system', content: sys }, { role: 'user', content: user }], judge.model,
    { temperature: 0.35, maxTokens: 1400 });
  const sm = raw.match(/SUMMARY:\s*([\s\S]*?)(?=CARRIED BY:|WINNER:|$)/i);
  const wm = raw.match(/(?:CARRIED BY|WINNER):\s*([\s\S]*)$/i);
  return {
    summary: (sm ? sm[1] : raw).trim(),
    verdict: (wm ? wm[1] : 'No clear verdict was returned.').trim(),
    by: nameOf(judge) + ' (' + judge.model + ')'
  };
}
