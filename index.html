    const ld = api.body.querySelector('[data-load]');
    if (ld) ld.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (d.members) { State.members = d.members; saveMembers(); }
            if (d.orders) { State.orders = Object.assign({}, DEFAULT_ORDERS, d.orders); saveOrders(); }
            State.motion = d.motion || ''; State.record = d.record || [];
            State.division = d.division || null;
            State.seq = State.record.reduce((a, e) => Math.max(a, e.n || 0), 0);
            State.responses = State.record.filter(e => e.kind === 'speech').length;
            State.sitting = false; State.paused = false;
            renderBench(); renderControls(); renderFloor(); autosave(); m.close();
            toast('Session loaded.', 'good');
          } catch (e) { toast('That file could not be read: ' + e.message, 'bad'); }
        };
        r.readAsText(f);
      };
      inp.click();
    };
    const wp = api.body.querySelector('[data-wipe]');
    if (wp) wp.onclick = () => confirmDialog('Erase everything?',
      'Members, standing orders, saved keys, cached model lists and the current record will all be deleted from this browser \u2014 including the keys held in the vault your other tools read.',
      'Erase', () => {
        VAULT_ENGINES.forEach(k => Vault.forget(k, true));
        ['council.members','council.orders','council.keys','council.keysAt','council.keyStatus','council.shareKeys','council.ollamaUrl','council.modelCache','council.session'].forEach(LS.del);
        location.reload();
      });
  };
  draw(m);
  m.foot.querySelector('[data-done]').onclick = m.close;
}

/* ==========================================================================
   THE CHAIR — input box, dictation, keyboard
   ========================================================================== */
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(130, el.scrollHeight) + 'px';
}
function refreshChair() {
  const live = State.sitting, pool = seated();
  const put = $('#putLabel'), hint = $('#chairHint');
  $('#chairLabel').textContent = live ? 'Interject from the chair' : 'Propose a motion';
  if (put) put.textContent = live ? 'Interject' : 'Convene council';
  $('#motionBox').placeholder = live
    ? 'Put a point to the council\u2026'
    : 'What should the council debate?';
  if (hint) {
    const full = live
      ? 'Your interjection is added to every member\u2019s next brief.'
      : (pool.length >= MIN_MEMBERS
          ? 'Enter puts the motion to the council. Shift+Enter for a new line.'
          : 'Seat at least ' + MIN_MEMBERS + ' members to begin.');
    hint.setAttribute('title', full);
    hint.querySelector('span').textContent = live
      ? 'Your interjection is added to every member\u2019s next brief.'
      : (pool.length >= MIN_MEMBERS
          ? 'Enter puts the motion to the council. Shift+Enter for a new line.'
          : 'Seat at least ' + MIN_MEMBERS + ' members to begin.');
  }
}
function submitChair() {
  const box = $('#motionBox');
  const text = box.value.trim();
  if (!text) return;
  // If the council cannot sit yet, keep the wording rather than throwing it away.
  const started = State.sitting ? interject(text) : convene(text);
  if (started === false) { renderBench(); return; }
  box.value = ''; autoGrow(box); renderBench(); refreshChair();
}

const Dictation = {
  rec: null, live: false,
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  toggle() {
    if (!this.supported()) { toast('This browser has no speech recognition. Chrome and Edge do.', 'bad'); return; }
    if (this.live) { try { this.rec.stop(); } catch {} return; }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new R();
    r.continuous = false; r.interimResults = true; r.lang = navigator.language || 'en-AU';
    const box = $('#motionBox'), btn = $('#btnMic');
    const base = box.value ? box.value.trim() + ' ' : '';
    r.onresult = ev => {
      let t = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      box.value = base + t; autoGrow(box); renderBench();
    };
    r.onerror = ev => { toast('Dictation stopped: ' + ev.error, 'bad'); };
    r.onend = () => { this.live = false; btn.classList.remove('live'); renderBench(); };
    this.rec = r; this.live = true; btn.classList.add('live');
    try { r.start(); } catch (e) { this.live = false; btn.classList.remove('live'); toast('Dictation would not start: ' + e.message, 'bad'); }
  }
};

/* ==========================================================================
   BOOT
   ========================================================================== */
function migrate() {
  State.division = State.division || null;
  State.members = (State.members || []).filter(Boolean).map((m, i) => {
    if (!m.id) m.id = uid();
    if (!m.engine) m.engine = 'ollama';
    if (!ENGINES[m.engine]) m.engine = 'ollama';
    if (!m.colour) m.colour = HOUSE_COLOURS[i % HOUSE_COLOURS.length];
    if (!m.glyph) m.glyph = GLYPHS[i % GLYPHS.length];
    if (!m.temperament) m.temperament = TEMPERAMENTS[i % TEMPERAMENTS.length].id;
    if (typeof m.temperature !== 'number') m.temperature = 0.8;
    if (!m.voice) m.voice = { openai: OPENAI_VOICES[i % OPENAI_VOICES.length], rate: 1, pitch: 1, browserURI: '' };
    if (m.active === undefined) m.active = true;
    if (!m.model) m.model = defaultModelFor(m.engine);
    return m;
  }).slice(0, 5);
  saveMembers();
}

/* The 256px seal is in the document once, as the masthead image. Point the
   icon links at the same data URI so the tab, the taskbar and an iOS home
   screen all get the full-resolution mark without a second copy in the file. */
function dressIcons() {
  const img = $('#appIcon');
  if (!img || !img.src) return;
  [['icon', '256x256'], ['apple-touch-icon', ''], ['shortcut icon', '']].forEach(([rel, sizes]) => {
    const l = document.createElement('link');
    l.rel = rel; l.type = 'image/png';
    if (sizes) l.sizes = sizes;
    l.href = img.src;
    document.head.appendChild(l);
  });
}

function boot() {
  /* Opened at #ai-relay this file is not the chamber at all, it is the errand
     boy for a chamber running in a frame somewhere else. Nothing below applies. */
  if (Relay.wanted()) { Relay.start(); return; }

  /* Ask the embedding page, once and quietly, whether it carries the bridge.
     Finding it changes nothing until the user allows it in Connection. */
  if (Frame.embedded) Link.findHost().catch(() => {});

  dressIcons();
  migrate();
  Voice.init();
  restoreSession();
  renderBench(); renderControls(); renderFloor(); refreshChair();

  const box = $('#motionBox');
  autoGrow(box);
  box.addEventListener('input', () => { autoGrow(box); renderBench(); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChair(); }
  });
  $('#btnPut').onclick = submitChair;
  $('#btnMic').onclick = () => Dictation.toggle();
  if (!Dictation.supported()) $('#btnMic').style.display = 'none';
  $('#btnEngines').onclick = openEngines;
  $('#btnStanding').onclick = openStandingOrders;
  $('#btnGuide').onclick = openGuide;

  // Warm the local model lists quietly, so the first seat picker is populated.
  fetchModels('ollama', false).then(l => {
    if (l.length) markEnginesReady();
  }).catch(() => {
    /* In a frame this is the expected first failure, and saying nothing would
       leave the user staring at an empty model list with no idea why. */
    if (Frame.embedded && !wireHelped()) {
      setTimeout(() => toast('Ollama could not be reached from inside this frame. Open Engines \u2192 Connection to start the relay window.', 'bad'), 900);
    }
  });
  // Hosted engines wait for the key check, so a dead key never seeds a model list.
  startupKeyCheck()
    .catch(e => console.warn('key check', e))
    .then(() => {
      Object.keys(ENGINES).forEach(k => { if (ENGINES[k].needsKey && hasKey(k)) fetchModels(k, false).catch(() => {}); });
      markEnginesReady();
      renderBench();
    });
  markEnginesReady();

  if (!State.members.length && !State.record.length) {
    setTimeout(() => {
      const any = ENGINE_ORDER.some(k => ENGINES[k].needsKey ? hasKey(k) : (State.modelCache[k] && State.modelCache[k].list && State.modelCache[k].list.length));
      if (!any) openGuide();
    }, 700);
  }

  window.addEventListener('beforeunload', e => {
    if (State.sitting) { e.preventDefault(); e.returnValue = ''; }
  });
}
function markEnginesReady() {
  const ready = ENGINE_ORDER.filter(k => ENGINES[k].needsKey && hasKey(k)).length;
  $('#btnEngines').classList.toggle('key-on', ready > 0);
}

boot();
</script>
